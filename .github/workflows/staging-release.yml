name: Staging release gate

on:
  workflow_dispatch:
    inputs:
      promote_production:
        description: Promote the verified prebuilt deployment to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: loopgraph-staging-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod

  staging:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
      - run: npx vercel build --token="${VERCEL_TOKEN}"
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
      - id: deploy
        shell: bash
        run: echo "url=$(npx vercel deploy --prebuilt --token=\"${VERCEL_TOKEN}\")" >> "$GITHUB_OUTPUT"
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }

  marketplace:
    needs: staging
    runs-on: [self-hosted, loopgraph-staging]
    environment: marketplace-staging
    outputs:
      organization_id: ${{ steps.receipt.outputs.organization_id }}
      project_key: ${{ steps.receipt.outputs.project_key }}
      app_id: ${{ steps.receipt.outputs.app_id }}
      app_version: ${{ steps.receipt.outputs.app_version }}
      artifact_digest: ${{ steps.receipt.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --silent validate:staging > staging-validation-receipt.json
        env:
          LOOPGRAPH_STAGING_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_STAGING_ORGANIZATION_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID }}"
          LOOPGRAPH_STAGING_PROJECT_KEY: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY }}"
          LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_SUPABASE_URL: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_URL }}"
          LOOPGRAPH_STAGING_SUPABASE_PUBLISHABLE_KEY: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_PUBLISHABLE_KEY }}"
          LOOPGRAPH_STAGING_ALLOWED_USER_SESSION_FILE: "${{ vars.LOOPGRAPH_STAGING_ALLOWED_USER_SESSION_FILE }}"
          LOOPGRAPH_STAGING_FOREIGN_USER_SESSION_FILE: "${{ vars.LOOPGRAPH_STAGING_FOREIGN_USER_SESSION_FILE }}"
          LOOPGRAPH_STAGING_SUSPENDED_USER_SESSION_FILE: "${{ vars.LOOPGRAPH_STAGING_SUSPENDED_USER_SESSION_FILE }}"
          LOOPGRAPH_STAGING_USER_API_ADMIN_QUOTA_LIMIT: "${{ vars.LOOPGRAPH_STAGING_USER_API_ADMIN_QUOTA_LIMIT }}"
          LOOPGRAPH_STAGING_USER_API_QUOTA_MAX_WAIT_SECONDS: "${{ vars.LOOPGRAPH_STAGING_USER_API_QUOTA_MAX_WAIT_SECONDS }}"
      - run: npm run --silent validate:marketplace-staging > marketplace-validation-receipt.json
        env:
          LOOPGRAPH_STAGING_MARKETPLACE_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_STAGING_MARKETPLACE_AUDIENCE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_AUDIENCE }}"
          LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID }}"
          LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY }}"
          LOOPGRAPH_STAGING_MARKETPLACE_APP_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_APP_ID }}"
          LOOPGRAPH_STAGING_MARKETPLACE_APP_VERSION: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_APP_VERSION }}"
          LOOPGRAPH_STAGING_MARKETPLACE_ARTIFACT_DIGEST: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ARTIFACT_DIGEST }}"
          LOOPGRAPH_STAGING_MARKETPLACE_ALLOWED_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ALLOWED_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_MARKETPLACE_FOREIGN_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_FOREIGN_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_MARKETPLACE_REVOKED_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_REVOKED_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE }}"
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-staging-evidence
          path: |
            staging-validation-receipt.json
            marketplace-validation-receipt.json
          if-no-files-found: error
          retention-days: 90
      - id: receipt
        run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("marketplace-validation-receipt.json","utf8"));const fields={organization_id:value.organizationId,project_key:value.projectKey,app_id:value.app?.id,app_version:value.app?.version,artifact_digest:value.app?.artifactDigest};const patterns={organization_id:/^[0-9a-f-]{36}$/i,project_key:/^[a-z0-9][a-z0-9_-]{0,63}$/,app_id:/^[A-Za-z0-9._:-]{1,256}$/,app_version:/^[A-Za-z0-9._+-]{1,128}$/,artifact_digest:/^sha256:[a-f0-9]{64}$/};for(const [name,field] of Object.entries(fields)){if(typeof field!=="string"||!patterns[name].test(field))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,`${name}=${field}\n`);}'

  recovery:
    needs: staging
    runs-on: [self-hosted, loopgraph-staging]
    environment: recovery-staging
    outputs:
      source_identity_digest: ${{ steps.receipt.outputs.source_identity_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --silent rehearse:restore > recovery-rehearsal-receipt.json
        env:
          LOOPGRAPH_CONFIRM_ISOLATED_RESTORE: "yes"
          LOOPGRAPH_BACKUP_SOURCE_DB_URL_FILE: "${{ vars.LOOPGRAPH_BACKUP_SOURCE_DB_URL_FILE }}"
          LOOPGRAPH_REHEARSAL_RESTORE_DB_URL_FILE: "${{ vars.LOOPGRAPH_REHEARSAL_RESTORE_DB_URL_FILE }}"
          LOOPGRAPH_REHEARSAL_TARGET_MARKER: "${{ vars.LOOPGRAPH_REHEARSAL_TARGET_MARKER }}"
          LOOPGRAPH_EXPECTED_SOURCE_DB_IDENTITY_DIGEST: "${{ vars.LOOPGRAPH_EXPECTED_SOURCE_DB_IDENTITY_DIGEST }}"
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-rehearsal-evidence
          path: recovery-rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 90
      - id: receipt
        run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("recovery-rehearsal-receipt.json","utf8"));if(!/^sha256:[a-f0-9]{64}$/.test(value.sourceIdentityDigest))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,`source_identity_digest=${value.sourceIdentityDigest}\n`);'

  audit-retention:
    needs: [staging, marketplace]
    runs-on: [self-hosted, loopgraph-staging]
    environment: audit-retention-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-staging-evidence
          path: release-checkpoints
      - run: npm run --silent audit:drain > audit-retention-receipt.json
        env:
          LOOPGRAPH_AUDIT_SOURCE_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_AUDIT_RETENTION_URL: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_URL }}"
          LOOPGRAPH_AUDIT_ORGANIZATION_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID }}"
          LOOPGRAPH_AUDIT_PROJECT_KEY: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY }}"
          LOOPGRAPH_AUDIT_PAGE_SIZE: "${{ vars.LOOPGRAPH_AUDIT_PAGE_SIZE }}"
          LOOPGRAPH_AUDIT_MIN_RETENTION_DAYS: "${{ vars.LOOPGRAPH_AUDIT_MIN_RETENTION_DAYS }}"
          LOOPGRAPH_AUDIT_RETENTION_KEY_ID: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_KEY_ID }}"
          LOOPGRAPH_AUDIT_SOURCE_TOKEN_FILE: "${{ vars.LOOPGRAPH_AUDIT_SOURCE_TOKEN_FILE }}"
          LOOPGRAPH_AUDIT_RETENTION_TOKEN_FILE: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_TOKEN_FILE }}"
          LOOPGRAPH_AUDIT_RETENTION_PUBLIC_KEY_FILE: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_PUBLIC_KEY_FILE }}"
          LOOPGRAPH_AUDIT_RETENTION_PREVIOUS_KEY_ID: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_PREVIOUS_KEY_ID }}"
          LOOPGRAPH_AUDIT_RETENTION_PREVIOUS_PUBLIC_KEY_FILE: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_PREVIOUS_PUBLIC_KEY_FILE }}"
          LOOPGRAPH_AUDIT_RECEIPT_STATE_FILE: "${{ vars.LOOPGRAPH_AUDIT_RECEIPT_STATE_FILE }}"
          LOOPGRAPH_AUDIT_STAGING_RECEIPT_FILE: "${{ github.workspace }}/release-checkpoints/staging-validation-receipt.json"
          LOOPGRAPH_AUDIT_MARKETPLACE_RECEIPT_FILE: "${{ github.workspace }}/release-checkpoints/marketplace-validation-receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-retention-receipt
          path: audit-retention-receipt.json
          if-no-files-found: error
          retention-days: 90

  evidence:
    needs: [staging, marketplace, recovery, audit-retention]
    runs-on: ubuntu-latest
    environment: release-evidence
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.digest }}
      organization_id: ${{ needs.marketplace.outputs.organization_id }}
      project_key: ${{ needs.marketplace.outputs.project_key }}
      database_identity_digest: ${{ needs.recovery.outputs.source_identity_digest }}
      app_id: ${{ needs.marketplace.outputs.app_id }}
      app_version: ${{ needs.marketplace.outputs.app_version }}
      artifact_digest: ${{ needs.marketplace.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-staging-evidence
          path: release-evidence
      - uses: actions/download-artifact@v4
        with:
          name: recovery-rehearsal-evidence
          path: release-evidence
      - uses: actions/download-artifact@v4
        with:
          name: audit-retention-receipt
          path: release-evidence
      - run: npm run --silent release:evidence:build > release-evidence/production-evidence-manifest.json
        env:
          LOOPGRAPH_STAGING_RECEIPT_FILE: "${{ github.workspace }}/release-evidence/staging-validation-receipt.json"
          LOOPGRAPH_MARKETPLACE_RECEIPT_FILE: "${{ github.workspace }}/release-evidence/marketplace-validation-receipt.json"
          LOOPGRAPH_RECOVERY_RECEIPT_FILE: "${{ github.workspace }}/release-evidence/recovery-rehearsal-receipt.json"
          LOOPGRAPH_AUDIT_RECEIPT_FILE: "${{ github.workspace }}/release-evidence/audit-retention-receipt.json"
          LOOPGRAPH_RELEASE_DEPLOYMENT_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_RELEASE_ORGANIZATION_ID: "${{ needs.marketplace.outputs.organization_id }}"
          LOOPGRAPH_RELEASE_PROJECT_KEY: "${{ needs.marketplace.outputs.project_key }}"
          LOOPGRAPH_RELEASE_DATABASE_IDENTITY_DIGEST: "${{ needs.recovery.outputs.source_identity_digest }}"
          LOOPGRAPH_RELEASE_MARKETPLACE_APP_ID: "${{ needs.marketplace.outputs.app_id }}"
          LOOPGRAPH_RELEASE_MARKETPLACE_APP_VERSION: "${{ needs.marketplace.outputs.app_version }}"
          LOOPGRAPH_RELEASE_MARKETPLACE_ARTIFACT_DIGEST: "${{ needs.marketplace.outputs.artifact_digest }}"
          LOOPGRAPH_RELEASE_AUDIT_RETENTION_KEY_ID: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_KEY_ID }}"
          LOOPGRAPH_RELEASE_AUDIT_RETENTION_PUBLIC_KEY_PEM: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_PUBLIC_KEY_PEM }}"
          LOOPGRAPH_RELEASE_EVIDENCE_MAX_AGE_MINUTES: "${{ vars.LOOPGRAPH_RELEASE_EVIDENCE_MAX_AGE_MINUTES }}"
      - id: manifest
        run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("release-evidence/production-evidence-manifest.json","utf8"));if(!/^sha256:[a-f0-9]{64}$/.test(value.evidenceSetDigest))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,`digest=${value.evidenceSetDigest}\n`);'
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-evidence/production-evidence-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-promotion-evidence
          path: release-evidence/production-evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  promote:
    if: ${{ inputs.promote_production }}
    needs: [staging, evidence]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-staging-evidence
          path: release-evidence
      - uses: actions/download-artifact@v4
        with:
          name: recovery-rehearsal-evidence
          path: release-evidence
      - uses: actions/download-artifact@v4
        with:
          name: audit-retention-receipt
          path: release-evidence
      - uses: actions/download-artifact@v4
        with:
          name: production-promotion-evidence
          path: release-evidence
      - run: npm run --silent release:evidence:verify
        env:
          LOOPGRAPH_STAGING_RECEIPT_FILE: "${{ github.workspace }}/release-evidence/staging-validation-receipt.json"
          LOOPGRAPH_MARKETPLACE_RECEIPT_FILE: "${{ github.workspace }}/release-evidence/marketplace-validation-receipt.json"
          LOOPGRAPH_RECOVERY_RECEIPT_FILE: "${{ github.workspace }}/release-evidence/recovery-rehearsal-receipt.json"
          LOOPGRAPH_AUDIT_RECEIPT_FILE: "${{ github.workspace }}/release-evidence/audit-retention-receipt.json"
          LOOPGRAPH_RELEASE_DEPLOYMENT_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_RELEASE_ORGANIZATION_ID: "${{ needs.evidence.outputs.organization_id }}"
          LOOPGRAPH_RELEASE_PROJECT_KEY: "${{ needs.evidence.outputs.project_key }}"
          LOOPGRAPH_RELEASE_DATABASE_IDENTITY_DIGEST: "${{ needs.evidence.outputs.database_identity_digest }}"
          LOOPGRAPH_RELEASE_MARKETPLACE_APP_ID: "${{ needs.evidence.outputs.app_id }}"
          LOOPGRAPH_RELEASE_MARKETPLACE_APP_VERSION: "${{ needs.evidence.outputs.app_version }}"
          LOOPGRAPH_RELEASE_MARKETPLACE_ARTIFACT_DIGEST: "${{ needs.evidence.outputs.artifact_digest }}"
          LOOPGRAPH_RELEASE_AUDIT_RETENTION_KEY_ID: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_KEY_ID }}"
          LOOPGRAPH_RELEASE_AUDIT_RETENTION_PUBLIC_KEY_PEM: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_PUBLIC_KEY_PEM }}"
          LOOPGRAPH_RELEASE_EVIDENCE_MAX_AGE_MINUTES: "${{ vars.LOOPGRAPH_RELEASE_EVIDENCE_MAX_AGE_MINUTES }}"
          LOOPGRAPH_PRODUCTION_EVIDENCE_MANIFEST_FILE: "${{ github.workspace }}/release-evidence/production-evidence-manifest.json"
          LOOPGRAPH_EXPECTED_EVIDENCE_DIGEST: "${{ needs.evidence.outputs.manifest_digest }}"
      - run: gh attestation verify release-evidence/production-evidence-manifest.json --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: "${{ github.token }}"
      - run: npx vercel promote "${DEPLOYMENT_URL}" --token="${VERCEL_TOKEN}"
        env:
          DEPLOYMENT_URL: "${{ needs.staging.outputs.deployment_url }}"
          VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
