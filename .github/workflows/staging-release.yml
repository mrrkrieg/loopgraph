name: Staging release gate

on:
  workflow_dispatch:
    inputs:
      promote_production:
        description: Promote the verified prebuilt deployment to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: loopgraph-staging-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod

  staging:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
      - run: npx vercel build --token="${VERCEL_TOKEN}"
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
      - id: deploy
        shell: bash
        run: echo "url=$(npx vercel deploy --prebuilt --token=\"${VERCEL_TOKEN}\")" >> "$GITHUB_OUTPUT"
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }

  marketplace:
    needs: staging
    runs-on: [self-hosted, loopgraph-staging]
    environment: marketplace-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate:staging
        env:
          LOOPGRAPH_STAGING_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_STAGING_ORGANIZATION_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID }}"
          LOOPGRAPH_STAGING_PROJECT_KEY: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY }}"
          LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE }}"
      - run: npm run validate:marketplace-staging
        env:
          LOOPGRAPH_STAGING_MARKETPLACE_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_STAGING_MARKETPLACE_AUDIENCE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_AUDIENCE }}"
          LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID }}"
          LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY }}"
          LOOPGRAPH_STAGING_MARKETPLACE_APP_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_APP_ID }}"
          LOOPGRAPH_STAGING_MARKETPLACE_APP_VERSION: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_APP_VERSION }}"
          LOOPGRAPH_STAGING_MARKETPLACE_ARTIFACT_DIGEST: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ARTIFACT_DIGEST }}"
          LOOPGRAPH_STAGING_MARKETPLACE_ALLOWED_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ALLOWED_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_MARKETPLACE_FOREIGN_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_FOREIGN_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_MARKETPLACE_REVOKED_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_REVOKED_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE }}"

  promote:
    if: ${{ inputs.promote_production }}
    needs: [staging, marketplace]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vercel promote "${DEPLOYMENT_URL}" --token="${VERCEL_TOKEN}"
        env:
          DEPLOYMENT_URL: "${{ needs.staging.outputs.deployment_url }}"
          VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}"
