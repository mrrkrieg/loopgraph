name: Staging release gate

on:
  repository_dispatch:
    types: [staging-release]

permissions:
  contents: read

concurrency:
  group: loopgraph-staging-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/loopgraph/canvas-first'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod

  staging:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vercel pull --yes --environment=preview --token="${VERCEL_TOKEN}"
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
      - run: npx vercel build --token="${VERCEL_TOKEN}"
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }
      - id: deploy
        shell: bash
        run: echo "url=$(npx vercel deploy --prebuilt --token=\"${VERCEL_TOKEN}\")" >> "$GITHUB_OUTPUT"
        env: { VERCEL_TOKEN: "${{ secrets.VERCEL_TOKEN }}" }

  marketplace:
    needs: staging
    runs-on: [self-hosted, loopgraph-staging]
    environment: marketplace-staging
    outputs:
      organization_id: ${{ steps.receipt.outputs.organization_id }}
      project_key: ${{ steps.receipt.outputs.project_key }}
      app_id: ${{ steps.receipt.outputs.app_id }}
      app_version: ${{ steps.receipt.outputs.app_version }}
      artifact_digest: ${{ steps.receipt.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --silent validate:staging > staging-validation-receipt.json
        env:
          LOOPGRAPH_STAGING_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_STAGING_ORGANIZATION_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID }}"
          LOOPGRAPH_STAGING_PROJECT_KEY: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY }}"
          LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_SUPABASE_URL: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_URL }}"
          LOOPGRAPH_STAGING_SUPABASE_PUBLISHABLE_KEY: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_PUBLISHABLE_KEY }}"
          LOOPGRAPH_STAGING_ALLOWED_USER_SESSION_FILE: "${{ vars.LOOPGRAPH_STAGING_ALLOWED_USER_SESSION_FILE }}"
          LOOPGRAPH_STAGING_FOREIGN_USER_SESSION_FILE: "${{ vars.LOOPGRAPH_STAGING_FOREIGN_USER_SESSION_FILE }}"
          LOOPGRAPH_STAGING_SUSPENDED_USER_SESSION_FILE: "${{ vars.LOOPGRAPH_STAGING_SUSPENDED_USER_SESSION_FILE }}"
          LOOPGRAPH_STAGING_USER_API_ADMIN_QUOTA_LIMIT: "${{ vars.LOOPGRAPH_STAGING_USER_API_ADMIN_QUOTA_LIMIT }}"
          LOOPGRAPH_STAGING_USER_API_QUOTA_MAX_WAIT_SECONDS: "${{ vars.LOOPGRAPH_STAGING_USER_API_QUOTA_MAX_WAIT_SECONDS }}"
      - run: npm run --silent prove:app-action-exactly-once > app-action-exactly-once-receipt.json
      - run: npm run --silent validate:marketplace-staging > marketplace-validation-receipt.json
        env:
          LOOPGRAPH_STAGING_MARKETPLACE_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_STAGING_MARKETPLACE_AUDIENCE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_AUDIENCE }}"
          LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID }}"
          LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY }}"
          LOOPGRAPH_STAGING_MARKETPLACE_APP_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_APP_ID }}"
          LOOPGRAPH_STAGING_MARKETPLACE_APP_VERSION: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_APP_VERSION }}"
          LOOPGRAPH_STAGING_MARKETPLACE_ARTIFACT_DIGEST: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ARTIFACT_DIGEST }}"
          LOOPGRAPH_STAGING_MARKETPLACE_ALLOWED_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ALLOWED_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_MARKETPLACE_FOREIGN_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_FOREIGN_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_MARKETPLACE_REVOKED_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_REVOKED_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketplace-staging-evidence
          path: |
            staging-validation-receipt.json
            app-action-exactly-once-receipt.json
            marketplace-validation-receipt.json
          if-no-files-found: error
          retention-days: 90
      - id: receipt
        run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("marketplace-validation-receipt.json","utf8"));const fields={organization_id:value.organizationId,project_key:value.projectKey,app_id:value.app?.id,app_version:value.app?.version,artifact_digest:value.app?.artifactDigest};const patterns={organization_id:/^[0-9a-f-]{36}$/i,project_key:/^[a-z0-9][a-z0-9_-]{0,63}$/,app_id:/^[A-Za-z0-9._:-]{1,256}$/,app_version:/^[A-Za-z0-9._+-]{1,128}$/,artifact_digest:/^sha256:[a-f0-9]{64}$/};for(const [name,field] of Object.entries(fields)){if(typeof field!=="string"||!patterns[name].test(field))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,`${name}=${field}\n`);}'

  app-evidence-health:
    needs: [staging, marketplace]
    runs-on: [self-hosted, loopgraph-staging]
    environment: app-evidence-health-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --silent validate:app-evidence-health-staging > app-evidence-health-staging-receipt.json
        env:
          LOOPGRAPH_STAGING_APP_EVIDENCE_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_STAGING_APP_EVIDENCE_ORGANIZATION_ID: "${{ needs.marketplace.outputs.organization_id }}"
          LOOPGRAPH_STAGING_APP_EVIDENCE_PROJECT_KEY: "${{ needs.marketplace.outputs.project_key }}"
          LOOPGRAPH_STAGING_APP_EVIDENCE_SCHEDULE_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_APP_EVIDENCE_SCHEDULE_TOKEN_FILE }}"
          LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE: "${{ vars.LOOPGRAPH_STAGING_OBSERVABILITY_TOKEN_FILE }}"
      - run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("app-evidence-health-staging-receipt.json","utf8"));const names=["unauthenticated_denial","cross_tenant_denial","authorized_health_projection","replay_denial","aggregate_only_contract","metrics_projection_parity"];if(value.schemaVersion!=="hosted-app-evidence-health-staging-validation/v1"||value.checks?.length!==names.length||names.some((name,index)=>value.checks[index]?.name!==name||value.checks[index]?.ok!==true))process.exit(1);'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-evidence-health-staging-evidence
          path: app-evidence-health-staging-receipt.json
          if-no-files-found: error
          retention-days: 90

  app-snapshots:
    needs: [staging, marketplace]
    runs-on: [self-hosted, loopgraph-staging]
    environment: app-snapshot-staging
    outputs:
      storage_origin: ${{ steps.receipt.outputs.storage_origin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --silent probe:app-snapshot-fence > app-snapshot-fence-probe-receipt.json
        env:
          LOOPGRAPH_APP_SNAPSHOT_FENCE_PROBE_ALLOW_MUTATION: "yes"
          LOOPGRAPH_APP_SNAPSHOT_FENCE_PROBE_SUPABASE_URL: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_URL }}"
          LOOPGRAPH_APP_SNAPSHOT_FENCE_PROBE_SERVICE_ROLE_KEY_FILE: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_SERVICE_ROLE_KEY_FILE }}"
          LOOPGRAPH_APP_SNAPSHOT_FENCE_PROBE_ORGANIZATION_ID: "${{ needs.marketplace.outputs.organization_id }}"
          LOOPGRAPH_EXPECTED_APP_SNAPSHOT_FENCE_PROBE_SCOPE_DIGEST: "${{ vars.LOOPGRAPH_EXPECTED_APP_SNAPSHOT_FENCE_PROBE_SCOPE_DIGEST }}"
      - run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("app-snapshot-fence-probe-receipt.json","utf8"));const names=["registry_insert_advanced","registry_update_advanced","registry_delete_advanced","storage_upload_advanced","storage_replace_advanced","storage_delete_advanced","probe_authority_clean","probe_generation_clean"];if(value.schemaVersion!=="hosted-app-snapshot-fence-probe/v1"||value.healthy!==true||!/^sha256:[a-f0-9]{64}$/.test(value.scopeDigest)||value.checks?.length!==names.length||names.some((name,index)=>value.checks[index]?.name!==name||value.checks[index]?.ok!==true))process.exit(1);'
      - run: npm run --silent validate:app-snapshots-staging > app-snapshot-staging-receipt.json
        env:
          LOOPGRAPH_STAGING_SUPABASE_URL: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_URL }}"
          LOOPGRAPH_STAGING_SUPABASE_PUBLISHABLE_KEY: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_PUBLISHABLE_KEY }}"
          LOOPGRAPH_STAGING_SUPABASE_SERVICE_ROLE_KEY_FILE: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_SERVICE_ROLE_KEY_FILE }}"
          LOOPGRAPH_STAGING_ALLOWED_USER_SESSION_FILE: "${{ vars.LOOPGRAPH_STAGING_ALLOWED_USER_SESSION_FILE }}"
          LOOPGRAPH_STAGING_ORGANIZATION_ID: "${{ needs.marketplace.outputs.organization_id }}"
          LOOPGRAPH_STAGING_PROJECT_KEY: "${{ needs.marketplace.outputs.project_key }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-snapshot-staging-evidence
          path: |
            app-snapshot-fence-probe-receipt.json
            app-snapshot-staging-receipt.json
          if-no-files-found: error
          retention-days: 90
      - id: receipt
        run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("app-snapshot-staging-receipt.json","utf8"));const origin=new URL(value.targetOrigin);if(value.schemaVersion!=="hosted-app-snapshot-staging-validation/v1"||origin.protocol!=="https:"||origin.pathname!=="/"||origin.username||origin.password||origin.search||origin.hash||value.checks?.length!==8)process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,`storage_origin=${origin.origin}\n`);'

  learning-entities:
    needs: marketplace
    runs-on: [self-hosted, loopgraph-staging]
    environment: learning-entity-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --silent validate:learning-entities-staging > learning-entity-staging-receipt.json
        env:
          LOOPGRAPH_LEARNING_ENTITY_PROBE_ALLOW_MUTATION: "yes"
          LOOPGRAPH_LEARNING_ENTITY_PROBE_SUPABASE_URL: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_URL }}"
          LOOPGRAPH_LEARNING_ENTITY_PROBE_SERVICE_ROLE_KEY_FILE: "${{ vars.LOOPGRAPH_STAGING_SUPABASE_SERVICE_ROLE_KEY_FILE }}"
          LOOPGRAPH_LEARNING_ENTITY_PROBE_ORGANIZATION_ID: "${{ needs.marketplace.outputs.organization_id }}"
          LOOPGRAPH_EXPECTED_LEARNING_ENTITY_PROBE_SCOPE_DIGEST: "${{ vars.LOOPGRAPH_EXPECTED_LEARNING_ENTITY_PROBE_SCOPE_DIGEST }}"
      - run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("learning-entity-staging-receipt.json","utf8"));const names=["distributed_measurement_claim","stale_lease_rejected","cross_replica_job_finalization","metric_sample_immutable","observed_outcome_immutable","value_ledger_immutable","cross_replica_entity_visibility","provider_alias_single_owner","probe_scope_clean"];if(value.schemaVersion!=="hosted-learning-entity-staging-validation/v1"||value.healthy!==true||!/^sha256:[a-f0-9]{64}$/.test(value.scopeDigest)||value.checks?.length!==names.length||names.some((name,index)=>value.checks[index]?.name!==name||value.checks[index]?.ok!==true))process.exit(1);'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: learning-entity-staging-evidence
          path: learning-entity-staging-receipt.json
          if-no-files-found: error
          retention-days: 90

  app-snapshot-recovery:
    needs: [app-snapshots, marketplace]
    runs-on: [self-hosted, loopgraph-staging]
    environment: app-snapshot-recovery
    outputs:
      restore_origin: ${{ steps.receipt.outputs.restore_origin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --silent rehearse:app-snapshot-restore > app-snapshot-recovery-receipt.json
        env:
          LOOPGRAPH_CONFIRM_ISOLATED_APP_SNAPSHOT_RESTORE: "yes"
          LOOPGRAPH_APP_SNAPSHOT_BACKUP_SOURCE_URL: "${{ needs.app-snapshots.outputs.storage_origin }}"
          LOOPGRAPH_APP_SNAPSHOT_BACKUP_SOURCE_SERVICE_ROLE_KEY_FILE: "${{ vars.LOOPGRAPH_APP_SNAPSHOT_BACKUP_SOURCE_SERVICE_ROLE_KEY_FILE }}"
          LOOPGRAPH_APP_SNAPSHOT_RESTORE_TARGET_URL: "${{ vars.LOOPGRAPH_APP_SNAPSHOT_RESTORE_TARGET_URL }}"
          LOOPGRAPH_APP_SNAPSHOT_RESTORE_TARGET_SERVICE_ROLE_KEY_FILE: "${{ vars.LOOPGRAPH_APP_SNAPSHOT_RESTORE_TARGET_SERVICE_ROLE_KEY_FILE }}"
          LOOPGRAPH_EXPECTED_APP_SNAPSHOT_RESTORE_ORIGIN: "${{ vars.LOOPGRAPH_EXPECTED_APP_SNAPSHOT_RESTORE_ORIGIN }}"
          LOOPGRAPH_APP_SNAPSHOT_RESTORE_ORGANIZATION_ID: "${{ needs.marketplace.outputs.organization_id }}"
          LOOPGRAPH_APP_SNAPSHOT_RESTORE_PROJECT_KEY: "${{ needs.marketplace.outputs.project_key }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-snapshot-recovery-evidence
          path: app-snapshot-recovery-receipt.json
          if-no-files-found: error
          retention-days: 90
      - id: receipt
        run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("app-snapshot-recovery-receipt.json","utf8"));const source=new URL(value.sourceOrigin);const restore=new URL(value.restoreOrigin);if(value.schemaVersion!=="hosted-app-snapshot-restore-rehearsal/v1"||source.origin===restore.origin||restore.protocol!=="https:"||restore.pathname!=="/"||restore.username||restore.password||restore.search||restore.hash||value.checks?.length!==6)process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,`restore_origin=${restore.origin}\n`);'

  app-snapshot-reconciliation:
    needs: [app-snapshots, marketplace]
    runs-on: [self-hosted, loopgraph-staging]
    environment: app-snapshot-reconciliation
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --silent reconcile:app-snapshots > app-snapshot-reconciliation-receipt.json
        env:
          LOOPGRAPH_APP_SNAPSHOT_RECONCILIATION_SUPABASE_URL: "${{ needs.app-snapshots.outputs.storage_origin }}"
          LOOPGRAPH_APP_SNAPSHOT_RECONCILIATION_SERVICE_ROLE_KEY_FILE: "${{ vars.LOOPGRAPH_APP_SNAPSHOT_RECONCILIATION_SERVICE_ROLE_KEY_FILE }}"
          LOOPGRAPH_APP_SNAPSHOT_RECONCILIATION_ORGANIZATION_ID: "${{ needs.marketplace.outputs.organization_id }}"
          LOOPGRAPH_APP_SNAPSHOT_RECONCILIATION_PROJECT_KEY: "${{ needs.marketplace.outputs.project_key }}"
          LOOPGRAPH_EXPECTED_APP_SNAPSHOT_RECONCILIATION_SCOPE_DIGEST: "${{ vars.LOOPGRAPH_EXPECTED_APP_SNAPSHOT_RECONCILIATION_SCOPE_DIGEST }}"
          LOOPGRAPH_EXPECTED_APP_SNAPSHOT_UNREFERENCED_INVENTORY_DIGEST: "${{ vars.LOOPGRAPH_EXPECTED_APP_SNAPSHOT_UNREFERENCED_INVENTORY_DIGEST }}"
          LOOPGRAPH_APP_SNAPSHOT_RECONCILIATION_ALLOW_EMPTY: "${{ vars.LOOPGRAPH_APP_SNAPSHOT_RECONCILIATION_ALLOW_EMPTY }}"
      - run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("app-snapshot-reconciliation-receipt.json","utf8"));if(value.schemaVersion!=="hosted-app-snapshot-reconciliation/v3"||value.healthy!==true||value.checks?.length!==10||value.inventoryPasses<2||value.inventoryPasses>4||!Number.isSafeInteger(value.inventoryGeneration)||value.inventoryGeneration<0||value.verifiedSnapshots!==value.detachedInstallations||value.missingSnapshots!==0||value.corruptSnapshots!==0||value.untrackedSnapshots!==0||value.unavailableSnapshots!==0||value.malformedStorageObjects!==0||!/^sha256:[a-f0-9]{64}$/.test(value.scopeDigest)||!/^sha256:[a-f0-9]{64}$/.test(value.inventoryFenceDigest)||!/^sha256:[a-f0-9]{64}$/.test(value.inventoryGenerationDigest)||!/^sha256:[a-f0-9]{64}$/.test(value.unreferencedInventoryDigest))process.exit(1);'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-snapshot-reconciliation-evidence
          path: app-snapshot-reconciliation-receipt.json
          if-no-files-found: error
          retention-days: 90

  recovery:
    needs: staging
    runs-on: [self-hosted, loopgraph-staging]
    environment: recovery-staging
    outputs:
      source_identity_digest: ${{ steps.receipt.outputs.source_identity_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --silent rehearse:restore > recovery-rehearsal-receipt.json
        env:
          LOOPGRAPH_CONFIRM_ISOLATED_RESTORE: "yes"
          LOOPGRAPH_BACKUP_SOURCE_DB_URL_FILE: "${{ vars.LOOPGRAPH_BACKUP_SOURCE_DB_URL_FILE }}"
          LOOPGRAPH_REHEARSAL_RESTORE_DB_URL_FILE: "${{ vars.LOOPGRAPH_REHEARSAL_RESTORE_DB_URL_FILE }}"
          LOOPGRAPH_REHEARSAL_TARGET_MARKER: "${{ vars.LOOPGRAPH_REHEARSAL_TARGET_MARKER }}"
          LOOPGRAPH_EXPECTED_SOURCE_DB_IDENTITY_DIGEST: "${{ vars.LOOPGRAPH_EXPECTED_SOURCE_DB_IDENTITY_DIGEST }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-rehearsal-evidence
          path: recovery-rehearsal-receipt.json
          if-no-files-found: error
          retention-days: 90
      - id: receipt
        run: >-
          node -e 'const fs=require("fs");const value=JSON.parse(fs.readFileSync("recovery-rehearsal-receipt.json","utf8"));if(!/^sha256:[a-f0-9]{64}$/.test(value.sourceIdentityDigest))process.exit(1);fs.appendFileSync(process.env.GITHUB_OUTPUT,`source_identity_digest=${value.sourceIdentityDigest}\n`);'

  audit-retention:
    needs: [staging, marketplace]
    runs-on: [self-hosted, loopgraph-staging]
    environment: audit-retention-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: marketplace-staging-evidence
          path: release-checkpoints
      - run: npm run --silent audit:drain > audit-retention-receipt.json
        env:
          LOOPGRAPH_AUDIT_SOURCE_URL: "${{ needs.staging.outputs.deployment_url }}"
          LOOPGRAPH_AUDIT_RETENTION_URL: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_URL }}"
          LOOPGRAPH_AUDIT_ORGANIZATION_ID: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_ORGANIZATION_ID }}"
          LOOPGRAPH_AUDIT_PROJECT_KEY: "${{ vars.LOOPGRAPH_STAGING_MARKETPLACE_PROJECT_KEY }}"
          LOOPGRAPH_AUDIT_PAGE_SIZE: "${{ vars.LOOPGRAPH_AUDIT_PAGE_SIZE }}"
          LOOPGRAPH_AUDIT_MIN_RETENTION_DAYS: "${{ vars.LOOPGRAPH_AUDIT_MIN_RETENTION_DAYS }}"
          LOOPGRAPH_AUDIT_RETENTION_KEY_ID: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_KEY_ID }}"
          LOOPGRAPH_AUDIT_SOURCE_TOKEN_FILE: "${{ vars.LOOPGRAPH_AUDIT_SOURCE_TOKEN_FILE }}"
          LOOPGRAPH_AUDIT_RETENTION_TOKEN_FILE: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_TOKEN_FILE }}"
          LOOPGRAPH_AUDIT_RETENTION_PUBLIC_KEY_FILE: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_PUBLIC_KEY_FILE }}"
          LOOPGRAPH_AUDIT_RETENTION_PREVIOUS_KEY_ID: "${{ vars.LOOPGRAPH_AUDIT_RETENTION_PREVIOUS_KEY_ID }}"
