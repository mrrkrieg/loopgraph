apiVersion: loopgraph/v1alpha1
kind: Loop
metadata:
  id: management-review
  name: Management Review Loop
  version: "1.0.0"
  description: Consumes normalized EscalationCase objects and produces ownership and dependency plans.
  owner:
    role: management
trigger:
  type: schedule
  source: cron
  event: weekly.management_review
input:
  schema:
    type: object
    required: [cases]
    properties:
      cases: { type: array }
  fixtures:
    - id: open-cases-weekly
      path: ../../fixtures/management-review/open-cases-weekly.json
output:
  schema:
    type: object
    required: [decisionSummary, proposedActions, evidence, policyInputs, verificationRequest]
    properties:
      decisionSummary: { type: string }
      proposedActions: { type: array }
      evidence: { type: array }
      policyInputs: { type: array }
      verificationRequest: { type: object }
context:
  sources:
    - id: open_cases
      type: policy
      title: Open escalation cases
      sensitivity: internal
      trusted: true
      precedence: 0
  precedence:
    - { sourceType: policy, rank: 0 }
  redactionPolicy: restricted_only
routine:
  steps:
    - id: step_1
      name: Consume cases
      stepType: observe
      actor: system
      description: Read normalized EscalationCase payloads only
    - id: step_2
      name: Produce management plan
      stepType: assess
      actor: agent
      description: Route ownership, dependencies, and leadership decisions
tools: []
policy:
  allowedActions: []
  forbiddenActions: []
  escalationRules: []
verification: []
approval:
  requireFingerprintMatch: true
  separateCustomerFacingApproval: true
  allowedRoles: [owner, accountability_holder]
persistence:
  idempotency:
    enabled: true
trace:
  captureContextSnapshot: true
  captureToolInputOutput: true
  evidenceRequired: false
