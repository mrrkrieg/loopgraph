<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Loop Graph Engineering</title>
  <desc id="desc">A clear flow from verified signals to Hermes Brain, Loopgraph governance, a department, and multiple specialized loops.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#f3efe7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d4a3e"/>
      <stop offset="1" stop-color="#062f28"/>
    </linearGradient>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="25" refY="14" orient="auto">
      <path d="M0 0L28 14L0 28Z" fill="#0b4137"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="10" fill="#0b4137"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(72 58)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#0b4137" stroke-width="7"/>
      <circle cx="47" cy="24" r="20" fill="none" stroke="#0b4137" stroke-width="7"/>
      <path d="M33 35L55 13" stroke="#f4511e" stroke-width="8" stroke-linecap="round"/>
      <text x="87" y="35" font-size="32" font-weight="800" fill="#111">Loopgraph</text>
    </g>

    <text x="76" y="200" font-size="24" font-weight="800" letter-spacing="4" fill="#f4511e">GOVERNED AI OPERATIONS</text>
    <text x="72" y="337" font-size="104" font-weight="850" letter-spacing="-5" fill="#111">Loop Graph</text>
    <text x="72" y="448" font-size="104" font-weight="850" letter-spacing="-5" fill="#111">Engineering</text>
    <text x="76" y="526" font-size="36" font-weight="500" fill="#0b4137">The operating system for AI-run companies</text>
    <line x1="76" y1="582" x2="228" y2="582" stroke="#f4511e" stroke-width="10" stroke-linecap="round"/>
    <text x="76" y="650" font-size="30" font-weight="800" fill="#0b4137">Hermes decides</text>
    <text x="76" y="696" font-size="30" font-weight="800" fill="#0b4137">Loopgraph validates, governs, and records</text>

    <g transform="translate(865 120)">
      <rect width="250" height="124" rx="28" fill="#fff" stroke="#0b4137" stroke-width="5"/>
      <circle cx="64" cy="47" r="12" fill="#f4511e"/>
      <circle cx="104" cy="47" r="12" fill="#f4511e"/>
      <circle cx="144" cy="47" r="12" fill="#f4511e"/>
      <text x="125" y="93" text-anchor="middle" font-size="26" font-weight="800" fill="#0b4137">VERIFIED SIGNALS</text>
    </g>

    <path d="M990 246V296" stroke="#0b4137" stroke-width="6" marker-end="url(#arrow)"/>

    <g transform="translate(865 310)">
      <rect width="250" height="124" rx="28" fill="#fff3ea" stroke="#f4511e" stroke-width="6"/>
      <text x="125" y="55" text-anchor="middle" font-size="34" font-weight="850" fill="#111">HERMES</text>
      <text x="125" y="92" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="1.5" fill="#f4511e">COMPANY BRAIN</text>
    </g>

    <path d="M990 436V486" stroke="#0b4137" stroke-width="6" marker-end="url(#arrow)"/>

    <g transform="translate(865 500)">
      <rect width="250" height="124" rx="28" fill="url(#green)"/>
      <text x="125" y="55" text-anchor="middle" font-size="32" font-weight="850" fill="#fff">LOOPGRAPH</text>
      <text x="125" y="92" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="1.5" fill="#ffb188">CONTROL PLANE</text>
    </g>

    <path d="M1118 562H1192" stroke="#0b4137" stroke-width="6" marker-end="url(#arrow)"/>

    <g transform="translate(1207 500)">
      <rect width="300" height="124" rx="28" fill="#fff" stroke="#0b4137" stroke-width="5"/>
      <text x="150" y="55" text-anchor="middle" font-size="30" font-weight="850" fill="#0b4137">DEPARTMENT</text>
      <text x="150" y="92" text-anchor="middle" font-size="22" font-weight="700" fill="#6e6b65">owns the outcome</text>
    </g>

    <path d="M1357 626V680" stroke="#0b4137" stroke-width="6" marker-end="url(#arrow)"/>

    <g transform="translate(1122 714)">
      <circle cx="40" cy="40" r="40" fill="#f4511e"/>
      <circle cx="170" cy="40" r="40" fill="#f4511e"/>
      <circle cx="300" cy="40" r="40" fill="#f4511e"/>
      <text x="40" y="48" text-anchor="middle" font-size="28" font-weight="850" fill="#fff">L1</text>
      <text x="170" y="48" text-anchor="middle" font-size="28" font-weight="850" fill="#fff">L2</text>
      <text x="300" y="48" text-anchor="middle" font-size="28" font-weight="850" fill="#fff">L3</text>
      <text x="170" y="116" text-anchor="middle" font-size="26" font-weight="800" fill="#0b4137">MULTIPLE SPECIALIZED LOOPS</text>
    </g>
  </g>
</svg>
