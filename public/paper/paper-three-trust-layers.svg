<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three trust layers</title>
  <desc id="desc">The Connector Broker controls provider access, Hermes supplies judgment and execution, and Loopgraph validates, governs, and records.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#f3efe7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d4a3e"/>
      <stop offset="1" stop-color="#062f28"/>
    </linearGradient>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="25" refY="14" orient="auto">
      <path d="M0 0L28 14L0 28Z" fill="#0b4137"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="72" font-size="24" font-weight="800" letter-spacing="3.5" fill="#f4511e">03 / SEPARATE TRUST BOUNDARIES</text>
    <text x="68" y="148" font-size="58" font-weight="850" letter-spacing="-2" fill="#111">Reasoning is not authorization</text>
    <text x="68" y="193" font-size="28" font-weight="500" fill="#0b4137">Each layer has one clear responsibility</text>

    <path d="M512 481H562" stroke="#0b4137" stroke-width="6" marker-end="url(#arrow)"/>
    <path d="M1038 481H1088" stroke="#0b4137" stroke-width="6" marker-end="url(#arrow)"/>

    <g transform="translate(60 275)">
      <rect width="452" height="414" rx="36" fill="#fff" stroke="#0b4137" stroke-width="5"/>
      <text x="42" y="54" font-size="23" font-weight="850" letter-spacing="2" fill="#f4511e">01 / PROVIDER BOUNDARY</text>
      <text x="42" y="100" font-size="34" font-weight="850" fill="#111">CONNECTOR BROKER</text>
      <line x1="42" y1="128" x2="410" y2="128" stroke="#d9d3c8" stroke-width="3"/>
      <circle cx="57" cy="178" r="9" fill="#f4511e"/>
      <circle cx="57" cy="238" r="9" fill="#f4511e"/>
      <circle cx="57" cy="298" r="9" fill="#f4511e"/>
      <text x="84" y="187" font-size="27" font-weight="700" fill="#0b4137">Verifies events</text>
      <text x="84" y="247" font-size="27" font-weight="700" fill="#0b4137">Protects credentials</text>
      <text x="84" y="307" font-size="27" font-weight="700" fill="#0b4137">Exposes bounded tools</text>
      <rect x="42" y="337" width="368" height="56" rx="20" fill="#e3eee9"/>
      <text x="226" y="373" text-anchor="middle" font-size="23" font-weight="850" fill="#0b4137">NO TOKENS IN HERMES</text>
    </g>

    <g transform="translate(574 247)">
      <rect width="452" height="470" rx="38" fill="#fff3ea" stroke="#f4511e" stroke-width="6"/>
      <text x="42" y="59" font-size="23" font-weight="850" letter-spacing="2" fill="#f4511e">02 / SEMANTIC BRAIN</text>
      <text x="42" y="123" font-size="48" font-weight="850" fill="#111">HERMES</text>
      <line x1="42" y1="154" x2="410" y2="154" stroke="#f2b596" stroke-width="3"/>
      <circle cx="57" cy="209" r="9" fill="#f4511e"/>
      <circle cx="57" cy="277" r="9" fill="#f4511e"/>
      <circle cx="57" cy="345" r="9" fill="#f4511e"/>
      <text x="84" y="218" font-size="27" font-weight="700" fill="#0b4137">Understands the problem</text>
      <text x="84" y="286" font-size="27" font-weight="700" fill="#0b4137">Selects or abstains</text>
      <text x="84" y="354" font-size="27" font-weight="700" fill="#0b4137">Performs assigned work</text>
      <rect x="42" y="395" width="368" height="72" rx="22" fill="#f4511e"/>
      <text x="226" y="440" text-anchor="middle" font-size="24" font-weight="850" fill="#fff">DECIDES + ORCHESTRATES</text>
    </g>

    <g transform="translate(1100 275)">
      <rect width="440" height="414" rx="36" fill="url(#green)"/>
      <text x="42" y="54" font-size="23" font-weight="850" letter-spacing="2" fill="#ffb188">03 / CONTROL PLANE</text>
      <text x="42" y="112" font-size="42" font-weight="850" fill="#fff">LOOPGRAPH</text>
      <line x1="42" y1="142" x2="398" y2="142" stroke="#6b9489" stroke-width="3"/>
      <circle cx="57" cy="183" r="9" fill="#f4511e"/>
      <circle cx="57" cy="239" r="9" fill="#f4511e"/>
      <circle cx="57" cy="295" r="9" fill="#f4511e"/>
      <text x="84" y="192" font-size="27" font-weight="700" fill="#fff">Validates the contract</text>
      <text x="84" y="248" font-size="27" font-weight="700" fill="#fff">Enforces authority</text>
      <text x="84" y="304" font-size="27" font-weight="700" fill="#fff">Records the outcome</text>
      <rect x="42" y="337" width="356" height="56" rx="20" fill="#fff"/>
      <text x="220" y="373" text-anchor="middle" font-size="23" font-weight="850" fill="#0b4137">GOVERNS + RECORDS</text>
    </g>

    <text x="800" y="808" text-anchor="middle" font-size="32" font-weight="850" fill="#0b4137">Flexible intelligence. Bounded access. Deterministic authority.</text>
  </g>
</svg>
