    <text x="64" y="365" font-size="90" font-weight="900" letter-spacing="-3" fill="#101312">Engineering</text>
    <text x="66" y="430" font-size="31" font-weight="500" fill="#0b493f">The operating model for AI-run companies</text>
    <rect x="66" y="492" width="118" height="8" rx="4" fill="url(#orange)"/>
    <text x="66" y="555" font-size="27" font-weight="800" fill="#0b493f">Hermes interprets the problem</text>
    <text x="66" y="598" font-size="27" font-weight="800" fill="#0b493f">Loopgraph governs the decision</text>
    <text x="66" y="650" font-size="18" font-weight="800" letter-spacing="2.6" fill="#696963">VERSIONED CONTRACTS · BOUNDED AUTHORITY · OBSERVED OUTCOMES</text>

