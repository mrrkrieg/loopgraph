      <circle cx="866" cy="157" r="9" fill="#f4511e"/>
      <circle cx="894" cy="157" r="9" fill="#f4511e"/>
      <text x="898" y="194" text-anchor="middle" font-size="22" font-weight="850" fill="#0b493f">COMPANY EVENTS</text>

      <rect x="1074" y="116" width="276" height="102" rx="24" fill="url(#green)"/>
      <text x="1212" y="154" text-anchor="middle" font-size="23" font-weight="900" fill="#fff">CONNECTOR BROKER</text>
      <text x="1212" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#ffd0bc">verifies · normalizes · constrains</text>

