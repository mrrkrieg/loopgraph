      <text x="1212" y="551" text-anchor="middle" font-size="31" font-weight="900" fill="#fff">LOOPGRAPH</text>
      <text x="1212" y="587" text-anchor="middle" font-size="14" font-weight="800" letter-spacing="1.1" fill="#ffb18d">DETERMINISTIC AUTHORITY</text>

      <rect x="780" y="708" width="282" height="108" rx="26" fill="#fffdfa" stroke="#0b493f" stroke-width="4"/>
      <text x="921" y="750" text-anchor="middle" font-size="25" font-weight="900" fill="#0b493f">DEPARTMENT LOOP</text>
      <text x="921" y="783" text-anchor="middle" font-size="17" font-weight="700" fill="#696963">versioned work contract</text>

      <rect x="1300" y="708" width="238" height="108" rx="54" fill="url(#orange)"/>
      <text x="1419" y="751" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">OUTCOME</text>
      <text x="1419" y="783" text-anchor="middle" font-size="17" font-weight="700" fill="#fff0e8">measured evidence</text>
    </g>

    <path d="M1006 167H1054" fill="none" stroke="#0b493f" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1212 218V282" fill="none" stroke="#0b493f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="1240" y="258" font-size="15" font-weight="800" letter-spacing="1.2" fill="#696963">VERIFIED EVENT</text>
    <path d="M1212 422V485" fill="none" stroke="#0b493f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="1240" y="462" font-size="15" font-weight="800" letter-spacing="1.2" fill="#696963">PROPOSED ROUTE</text>
    <path d="M1130 625C1084 662 1022 687 973 705" fill="none" stroke="#0b493f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="942" y="695" text-anchor="end" font-size="12" font-weight="800" letter-spacing=".8" fill="#696963">VALIDATED ASSIGNMENT</text>
    <path d="M1062 762H1280" fill="none" stroke="#0b493f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="1170" y="730" text-anchor="middle" font-size="13" font-weight="800" letter-spacing=".8" fill="#696963">TASKS · APPROVALS</text>
    <text x="1170" y="750" text-anchor="middle" font-size="13" font-weight="800" letter-spacing=".8" fill="#696963">CAPABILITY ACTIONS</text>
    <path d="M1510 708C1552 598 1546 440 1380 367" fill="none" stroke="#f4511e" stroke-width="4" stroke-dasharray="11 10" marker-end="url(#arrow-orange)"/>
    <text x="1502" y="594" text-anchor="end" font-size="13" font-weight="800" letter-spacing=".9" fill="#f4511e">EVIDENCE RETURNS</text>
