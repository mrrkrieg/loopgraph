<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#f2ece1"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b493f"/>
      <stop offset="1" stop-color="#06342e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a2a"/>
      <stop offset="1" stop-color="#ee4316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b493f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M0 0L18 9L0 18Z" fill="#0b493f"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M0 0L18 9L0 18Z" fill="#f4511e"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="8" fill="#073b34"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(58 48)">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#0b493f" stroke-width="6"/>
      <circle cx="42" cy="24" r="20" fill="none" stroke="#0b493f" stroke-width="6"/>
      <path d="M25 42L45 7" stroke="#f4511e" stroke-width="7" stroke-linecap="round"/>
      <text x="78" y="33" font-size="31" font-weight="800" fill="#101312">Loopgraph</text>
    </g>

    <text x="64" y="166" font-size="21" font-weight="800" letter-spacing="4" fill="#f4511e">A PAPER ON GOVERNED AI OPERATIONS</text>
