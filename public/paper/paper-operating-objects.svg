<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The five operating objects</title>
  <desc id="desc">An event becomes evidence about a company object and a stateful problem. A loop run is an attempt, while the outcome is measured change.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#f3efe7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d4a3e"/>
      <stop offset="1" stop-color="#062f28"/>
    </linearGradient>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" refX="25" refY="14" orient="auto">
      <path d="M0 0L28 14L0 28Z" fill="#0b4137"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="72" font-size="24" font-weight="800" letter-spacing="3.5" fill="#f4511e">02 / ORGANIZATIONAL MEMORY</text>
    <text x="68" y="148" font-size="58" font-weight="850" letter-spacing="-2" fill="#111">Event ≠ object ≠ problem ≠ run ≠ outcome</text>
    <text x="68" y="193" font-size="28" font-weight="500" fill="#0b4137">Each object answers a different operating question</text>

    <g stroke="#0b4137" stroke-width="6" marker-end="url(#arrow)">
      <path d="M326 468H362"/>
      <path d="M625 468H661"/>
      <path d="M924 468H960"/>
      <path d="M1223 468H1259"/>
    </g>

    <g transform="translate(60 304)">
      <text x="133" y="-34" text-anchor="middle" font-size="25" font-weight="850" fill="#f4511e">01</text>
      <rect width="266" height="328" rx="30" fill="#fff" stroke="#0b4137" stroke-width="5"/>
      <text x="133" y="74" text-anchor="middle" font-size="36" font-weight="850" fill="#0b4137">EVENT</text>
      <line x1="42" y1="106" x2="224" y2="106" stroke="#d9d3c8" stroke-width="3"/>
      <text x="133" y="164" text-anchor="middle" font-size="27" font-weight="800" fill="#111">What happened?</text>
      <text x="133" y="222" text-anchor="middle" font-size="24" fill="#6e6b65">Immutable</text>
      <text x="133" y="260" text-anchor="middle" font-size="24" fill="#6e6b65">evidence</text>
    </g>

    <g transform="translate(359 304)">
      <text x="133" y="-34" text-anchor="middle" font-size="25" font-weight="850" fill="#f4511e">02</text>
      <rect width="266" height="328" rx="30" fill="#fff3ea" stroke="#f4511e" stroke-width="5"/>
      <text x="133" y="66" text-anchor="middle" font-size="31" font-weight="850" fill="#111">COMPANY</text>
      <text x="133" y="104" text-anchor="middle" font-size="31" font-weight="850" fill="#111">OBJECT</text>
      <line x1="42" y1="132" x2="224" y2="132" stroke="#f2b596" stroke-width="3"/>
      <text x="133" y="185" text-anchor="middle" font-size="26" font-weight="800" fill="#111">What is affected?</text>
      <text x="133" y="243" text-anchor="middle" font-size="24" fill="#6e6b65">Customer</text>
      <text x="133" y="281" text-anchor="middle" font-size="24" fill="#6e6b65">product · contract</text>
    </g>

    <g transform="translate(658 304)">
      <text x="133" y="-34" text-anchor="middle" font-size="25" font-weight="850" fill="#f4511e">03</text>
      <rect width="266" height="328" rx="30" fill="url(#green)"/>
      <text x="133" y="66" text-anchor="middle" font-size="31" font-weight="850" fill="#fff">BUSINESS</text>
      <text x="133" y="104" text-anchor="middle" font-size="31" font-weight="850" fill="#fff">PROBLEM</text>
      <line x1="42" y1="132" x2="224" y2="132" stroke="#6b9489" stroke-width="3"/>
      <text x="133" y="185" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">What must change?</text>
      <text x="133" y="243" text-anchor="middle" font-size="24" fill="#d6e7e2">State persists</text>
      <text x="133" y="281" text-anchor="middle" font-size="24" fill="#d6e7e2">across events</text>
    </g>

    <g transform="translate(957 304)">
      <text x="133" y="-34" text-anchor="middle" font-size="25" font-weight="850" fill="#f4511e">04</text>
      <rect width="266" height="328" rx="30" fill="#fff" stroke="#0b4137" stroke-width="5"/>
      <text x="133" y="74" text-anchor="middle" font-size="36" font-weight="850" fill="#0b4137">LOOP RUN</text>
      <line x1="42" y1="106" x2="224" y2="106" stroke="#d9d3c8" stroke-width="3"/>
      <text x="133" y="164" text-anchor="middle" font-size="27" font-weight="800" fill="#111">What did we try?</text>
      <text x="133" y="222" text-anchor="middle" font-size="24" fill="#6e6b65">Attempt 01</text>
      <text x="133" y="260" text-anchor="middle" font-size="24" fill="#6e6b65">Attempt 02</text>
    </g>

    <g transform="translate(1256 304)">
      <text x="133" y="-34" text-anchor="middle" font-size="25" font-weight="850" fill="#f4511e">05</text>
      <rect width="284" height="328" rx="30" fill="#f4511e"/>
      <text x="142" y="74" text-anchor="middle" font-size="36" font-weight="850" fill="#fff">OUTCOME</text>
      <line x1="46" y1="106" x2="238" y2="106" stroke="#ffb188" stroke-width="3"/>
      <text x="142" y="164" text-anchor="middle" font-size="27" font-weight="800" fill="#fff">Did it improve?</text>
      <text x="142" y="222" text-anchor="middle" font-size="24" fill="#fff">Observed</text>
      <text x="142" y="260" text-anchor="middle" font-size="24" fill="#fff">measured change</text>
    </g>

    <rect x="245" y="724" width="1110" height="94" rx="28" fill="#e3eee9"/>
    <text x="800" y="781" text-anchor="middle" font-size="30" font-weight="850" fill="#0b4137">The history survives every attempt</text>
  </g>
</svg>
