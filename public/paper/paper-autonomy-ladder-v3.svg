  <rect width="1600" height="900" fill="url(#bg5)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="67" font-size="20" font-weight="850" letter-spacing="3.2" fill="#f4511e">04 / AUTHORITY MUST BE EARNED</text>
    <text x="58" y="136" font-size="58" font-weight="900" letter-spacing="-1.8" fill="#101312">Autonomy is promoted, not switched on</text>
    <text x="58" y="178" font-size="25" fill="#0b493f">Each mode earns the next through evidence bound to the exact graph, loop version, and risk</text>

    <g filter="url(#s5)">
