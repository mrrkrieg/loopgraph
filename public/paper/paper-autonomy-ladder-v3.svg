    <line x1="922" y1="230" x2="922" y2="652" stroke="#f4511e" stroke-width="6"/>
    <text x="922" y="216" text-anchor="middle" font-size="17" font-weight="900" letter-spacing="1.4" fill="#f4511e">HUMAN AUTHORITY BOUNDARY</text>

    <path d="M74 723H1520" stroke="#0b493f" stroke-width="8" marker-end="url(#a5)"/>
    <g>
