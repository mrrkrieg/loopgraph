      <circle cx="472" cy="723" r="29" fill="#c4ddd4" stroke="#fff" stroke-width="5"/>
      <circle cx="772" cy="723" r="29" fill="#b3d2c7" stroke="#fff" stroke-width="5"/>
      <circle cx="1072" cy="723" r="29" fill="url(#orange5)" stroke="#fff" stroke-width="5"/>
      <circle cx="1372" cy="723" r="29" fill="#0b493f" stroke="#fff" stroke-width="5"/>
    </g>
    <g text-anchor="middle" font-size="17" font-weight="750" fill="#696963">
      <text x="172" y="780">routing precision</text><text x="472" y="780">false triggers</text><text x="772" y="780">outcome quality</text><text x="1072" y="780">review burden</text><text x="1372" y="780">failure behavior</text>
    </g>
    <text x="800" y="846" text-anchor="middle" font-size="23" font-style="italic" font-family="Georgia, serif" fill="#0b493f">Safety is how autonomy becomes credible.</text>
  </g>
