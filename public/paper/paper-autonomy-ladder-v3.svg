    <linearGradient id="dark5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b4d42"/><stop offset="1" stop-color="#06342e"/></linearGradient>
    <linearGradient id="orange5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6a2a"/><stop offset="1" stop-color="#ec4316"/></linearGradient>
