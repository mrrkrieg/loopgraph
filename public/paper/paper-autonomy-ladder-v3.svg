      <rect x="350" y="360" width="245" height="270" rx="30" fill="#e5f0ec" stroke="#0b493f" stroke-width="4"/>
      <rect x="650" y="310" width="245" height="320" rx="30" fill="#fffdfa" stroke="#0b493f" stroke-width="4"/>
      <rect x="950" y="260" width="245" height="370" rx="30" fill="#fff4ee" stroke="#f4511e" stroke-width="5"/>
      <rect x="1250" y="210" width="245" height="420" rx="30" fill="url(#dark5)"/>
    </g>

    <g text-anchor="middle">
      <circle cx="172" cy="458" r="30" fill="#d4e6df"/><text x="172" y="467" font-size="24" font-weight="900" fill="#0b493f">01</text>
      <text x="172" y="522" font-size="28" font-weight="900" fill="#0b493f">SIMULATE</text>
      <text x="172" y="557" font-size="18" fill="#696963">fixtures and traces</text>
      <text x="172" y="589" font-size="17" font-weight="800" fill="#0b493f">NO EXTERNAL WRITES</text>

      <circle cx="472" cy="408" r="30" fill="#c4ddd4"/><text x="472" y="417" font-size="24" font-weight="900" fill="#0b493f">02</text>
      <text x="472" y="474" font-size="28" font-weight="900" fill="#0b493f">SHADOW</text>
      <text x="472" y="509" font-size="18" fill="#696963">real signals</text>
      <text x="472" y="539" font-size="18" fill="#696963">route recorded only</text>
      <text x="472" y="586" font-size="17" font-weight="800" fill="#0b493f">NO LIVE WORK</text>

      <circle cx="772" cy="358" r="30" fill="#deeee9"/><text x="772" y="367" font-size="24" font-weight="900" fill="#0b493f">03</text>
      <text x="772" y="424" font-size="28" font-weight="900" fill="#0b493f">RECOMMEND</text>
      <text x="772" y="459" font-size="18" fill="#696963">prepared artifact</text>
      <text x="772" y="489" font-size="18" fill="#696963">evidence attached</text>
      <text x="772" y="536" font-size="17" font-weight="800" fill="#0b493f">HUMAN DECIDES</text>

      <circle cx="1072" cy="308" r="30" fill="#f4511e"/><text x="1072" y="317" font-size="24" font-weight="900" fill="#fff">04</text>
      <text x="1072" y="374" font-size="26" font-weight="900" fill="#f4511e">EXECUTE WITH</text>
      <text x="1072" y="406" font-size="26" font-weight="900" fill="#f4511e">APPROVAL</text>
      <text x="1072" y="451" font-size="18" fill="#696963">exact prepared action</text>
      <text x="1072" y="481" font-size="18" fill="#696963">content-bound fingerprint</text>
      <text x="1072" y="511" font-size="18" fill="#696963">single-use commit</text>
      <text x="1072" y="570" font-size="14" font-weight="800" fill="#a83812">PRIVILEGED WRITES GATED</text>

      <circle cx="1372" cy="258" r="30" fill="#f4511e"/><text x="1372" y="267" font-size="24" font-weight="900" fill="#fff">05</text>
      <text x="1372" y="324" font-size="26" font-weight="900" fill="#fff">AUTONOMOUS</text>
      <text x="1372" y="356" font-size="26" font-weight="900" fill="#fff">LOW RISK</text>
      <text x="1372" y="401" font-size="18" fill="#d8ebe6">bounded capability</text>
      <text x="1372" y="431" font-size="18" fill="#d8ebe6">reversible behavior</text>
      <text x="1372" y="461" font-size="18" fill="#d8ebe6">observed supervision</text>
      <text x="1372" y="491" font-size="18" fill="#d8ebe6">proven failure mode</text>
      <text x="1372" y="550" font-size="14" font-weight="800" fill="#ffb18d">NO CUSTOMER-FACING RISK</text>
