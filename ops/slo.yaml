version: loopgraph-slo/v2
service: loopgraph-hosted
windows:
  rolling_days: 30
objectives:
  - id: routing_ingest_availability
    target: 99.9
    indicator: successful_signed_event_ingests / valid_signed_event_ingest_attempts
    alert:
      fast_burn: { window: 1h, burn_rate: 14.4 }
      slow_burn: { window: 6h, burn_rate: 6 }
  - id: routing_decision_latency
    target: 99
    indicator: hermes_route_decision_seconds_bucket{le="30"}
    alert: { p99_seconds: 30 }
  - id: durable_receipt_integrity
    target: 100
    indicator: valid_audit_chain_checks / audit_chain_checks
    alert: { consecutive_failures: 1 }
  - id: measurement_freshness
    target: 99
    indicator: completed_measurement_jobs_before_deadline / due_measurement_jobs
    alert: { overdue_minutes: 30 }
  - id: audit_drain_freshness
    target: 100
    indicator: latest_external_audit_checkpoint_age_seconds
    alert: { max_seconds: 900 }
  - id: backup_recovery
    target: 100
    indicator: successful_quarterly_restore_rehearsals / scheduled_quarterly_restore_rehearsals
    alert: { maximum_days_since_success: 100 }
  - id: marketplace_tenant_isolation
    target: 100
    indicator: successful_foreign_tenant_denials / scheduled_marketplace_isolation_checks
    alert: { consecutive_failures: 1 }
  - id: marketplace_artifact_integrity
    target: 100
    indicator: exact_verified_marketplace_artifacts / scheduled_marketplace_artifact_checks
    alert: { consecutive_failures: 1 }
  - id: marketplace_revocation_effectiveness
    target: 100
    indicator: successful_revoked_workload_denials / scheduled_marketplace_revocation_checks
    alert: { consecutive_failures: 1 }
  - id: cli_refresh_replay_containment
    target: 100
    indicator: loopgraph_cli_refresh_reuse_unrevoked == 0
    alert:
      recent_replay_families: 1
      unrevoked_replay_families: 1
  - id: cli_device_authorization_freshness
    target: 100
    indicator: loopgraph_cli_device_authorization_oldest_pending_seconds <= 600
    alert:
      maximum_pending_seconds: 600
  - id: app_lifecycle_recovery_freshness
    target: 100
    indicator: completed_or_reconciled_app_lifecycle_operations / started_app_lifecycle_operations
    alert:
      interrupted_operations: 1
      stale_operations: 1
      default_stale_after_seconds: 900
  - id: app_action_reconciliation_freshness
    target: 100
    indicator: app_commits_with_terminal_receipts / app_commit_requests
    alert:
      stale_nonterminal_commits: 1
      default_stale_after_seconds: 300
  - id: app_evidence_freshness
    target: 100
    indicator: loopgraph_app_evidence_health
    alert:
      invalid_evidence: 1
      expired_evidence: 1
      renew_soon_evidence: 1
ownership:
  primary: platform-on-call
  security: security-owner
  data: evidence-ledger-owner
runbooks:
  routing: docs/OPERATIONAL-AUDIT-OBSERVABILITY.md
  restore: docs/PRODUCTION-OPERATIONS.md
  audit: docs/PRODUCTION-OPERATIONS.md
  app_lifecycle_recovery: docs/PRODUCTION-OPERATIONS.md
  app_action_reconciliation: docs/PRODUCTION-OPERATIONS.md
  app_evidence_freshness: docs/PRODUCTION-OPERATIONS.md
  cli_sessions: docs/OPERATIONAL-AUDIT-OBSERVABILITY.md
