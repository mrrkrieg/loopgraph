schemaVersion: loopgraph-app-setup/v1alpha1
kind: AppSetup
questions:
  - { key: approvedSystems, prompt: "Which CLM, policy, control, evidence, identity, SIEM, incident, CRM, questionnaire, HRIS, and audit systems are approved sources?", why: "Every legal and security statement must come from an authorized provider and bounded purpose.", valueType: object, requirement: required, inferFromContext: legal.approvedSystems, confirmWhenInferred: true }
  - { key: sourcePolicy, prompt: "Which source versions, citations, freshness windows, scope limits, conflict rules, and provenance receipts are required?", why: "Hermes must distinguish current evidence from stale or inapplicable material.", valueType: object, requirement: required, inferFromContext: compliance.sourcePolicy, confirmWhenInferred: true }
  - { key: playbookPolicy, prompt: "Which contract positions, fallbacks, jurisdictions, effective dates, exception categories, and qualified legal owners are approved?", why: "Clause comparison cannot invent legal positions or interpret law.", valueType: object, requirement: required, inferFromContext: legal.playbookPolicy, confirmWhenInferred: true }
  - { key: controlPolicy, prompt: "Which policy-control mappings, tests, exceptions, evidence requirements, materiality rules, and owners are authoritative?", why: "Drift and evidence-gap work require exact control and policy versions.", valueType: object, requirement: required, inferFromContext: compliance.controlPolicy, confirmWhenInferred: true }
  - { key: accessReviewPolicy, prompt: "Which grants, roles, toxic combinations, usage windows, expiry rules, owners, and separation-of-duties controls govern access review?", why: "Hermes prepares evidence while human owners decide and independently execute access changes.", valueType: object, requirement: required, inferFromContext: security.accessReviewPolicy, confirmWhenInferred: true }
  - { key: incidentEvidencePolicy, prompt: "Which incident scopes, collection authorizations, legal-hold, privacy, custody, retention, privilege, and disclosure rules apply?", why: "Incident evidence cannot be collected or reused outside an authorized window and system set.", valueType: object, requirement: required, inferFromContext: security.incidentEvidencePolicy, confirmWhenInferred: true }
  - { key: externalClaimPolicy, prompt: "Which security answers, control claims, attachments, customers, confidentiality levels, reviewers, and reuse limits are approved?", why: "Questionnaire answers are external representations and must never overstate current controls.", valueType: object, requirement: required, inferFromContext: security.externalClaimPolicy, confirmWhenInferred: true }
  - { key: expertBoundaries, prompt: "Which legal interpretation, exception, risk acceptance, breach, notification, access, attestation, and external-claim decisions are human-owned?", why: "The app must encode non-delegable expert judgment and separation of duties.", valueType: object, requirement: required, inferFromContext: legal.expertDecisionBoundaries, confirmWhenInferred: true }
  - { key: canonicalMappings, prompt: "How do provider contracts, clauses, controls, policies, grants, identities, incidents, questionnaires, accounts, and audit requests map to canonical company objects?", why: "Canonical identity prevents duplicate or cross-scope legal and security work.", valueType: object, requirement: required, inferFromContext: company.canonicalObjectMappings, confirmWhenInferred: true }
  - { key: escalationOwners, prompt: "Who owns legal review, privacy, security, compliance, identity, incident evidence, customer claims, and emergency revocation?", why: "Every abstention, exception, and critical action needs one accountable expert route.", valueType: object, requirement: required, inferFromContext: legal.escalationOwners, confirmWhenInferred: true }
  - { key: outcomeWindows, prompt: "Which windows prove cycle time, evidence quality, exception recurrence, access reduction, claim accuracy, audit readiness, and review burden?", why: "The app must learn from approved outcomes rather than activity volume.", valueType: object, requirement: required, inferFromContext: compliance.outcomeWindows, confirmWhenInferred: true }
  - { key: retentionDisclosurePolicy, prompt: "How are privileged, confidential, regulated, customer, people, and incident evidence retained, exported, disclosed, held, and deleted?", why: "Evidence lifecycle policy must cover provider reads, Hermes context, Loopgraph traces, receipts, exports, and backups.", valueType: object, requirement: required, inferFromContext: company.dataRetentionPolicy, confirmWhenInferred: true }
