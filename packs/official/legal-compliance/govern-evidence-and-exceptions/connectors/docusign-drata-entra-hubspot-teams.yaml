schemaVersion: loopgraph-connector-recipe/v1alpha1
id: docusign-drata-entra-hubspot-teams
providerId: docusign
providerFamily: docusign
displayName: DocuSign CLM + Drata + Entra + HubSpot + Teams
capabilities:
  - { logicalCapability: contract.record.read, providerOperation: docusign-clm.contracts.read-version, minimumScopes: [signature, organization_read], authority: read, risk: critical }
  - { logicalCapability: legal.playbook.read, providerOperation: legal-kb.playbooks.read, minimumScopes: [playbooks:read], authority: read, risk: critical }
  - { logicalCapability: crm.account.read, providerOperation: hubspot.crm.objects.read, minimumScopes: [crm.objects.companies.read, crm.objects.deals.read], authority: read, risk: high }
  - { logicalCapability: policy.control.read, providerOperation: drata.controls.read, minimumScopes: [controls:read], authority: read, risk: critical }
  - { logicalCapability: change.record.read, providerOperation: change-system.changes.read, minimumScopes: [changes:read], authority: read, risk: high }
  - { logicalCapability: identity.access.read, providerOperation: microsoft-graph.role-assignments.read, minimumScopes: [RoleManagement.Read.Directory], authority: read, risk: critical }
  - { logicalCapability: hris.employee.read, providerOperation: hris.workers.read-bounded, minimumScopes: [workers:read], authority: read, risk: critical }
  - { logicalCapability: access.log.read, providerOperation: microsoft-graph.audit-logs.read-bounded, minimumScopes: [AuditLog.Read.All], authority: read, risk: critical }
  - { logicalCapability: incident.record.read, providerOperation: incident-system.incidents.read, minimumScopes: [incidents:read], authority: read, risk: critical }
  - { logicalCapability: siem.event.read, providerOperation: siem.events.read-bounded, minimumScopes: [events:read], authority: read, risk: critical }
  - { logicalCapability: security.knowledge.read, providerOperation: security-kb.answers.read, minimumScopes: [answers:read], authority: read, risk: critical }
  - { logicalCapability: audit.evidence.read, providerOperation: drata.evidence.read, minimumScopes: [evidence:read], authority: read, risk: critical }
  - { logicalCapability: contract.comment.draft, providerOperation: docusign-clm.comments.draft, minimumScopes: [signature], authority: approve, risk: critical }
  - { logicalCapability: security.answer.draft, providerOperation: security-kb.answers.draft, minimumScopes: [answers:write], authority: approve, risk: critical }
  - { logicalCapability: identity.access.change, providerOperation: microsoft-graph.role-change.prepare, minimumScopes: [RoleManagement.ReadWrite.Directory], authority: approve, risk: critical }
  - { logicalCapability: project.task.create, providerOperation: project.tasks.create, minimumScopes: [tasks:write], authority: approve, risk: high }
eventSources:
  - { eventFamily: legal.contract_redline_received, providerEvent: docusign-clm.contract.version_created, transport: webhook, normalizationTransformer: docusign-clm.contract-to-legal-review.v1, signatureStrategy: docusign-hmac-sha256, replayProtection: true, fallbackPollMinutes: 30 }
  - { eventFamily: security.questionnaire_received, providerEvent: security-portal.questionnaire.created, transport: webhook, normalizationTransformer: questionnaire-to-security-review.v1, signatureStrategy: provider-hmac-sha256, replayProtection: true, fallbackPollMinutes: 30 }
  - { eventFamily: compliance.evidence_gap_detected, providerEvent: drata.evidence.missing, transport: webhook, normalizationTransformer: drata-gap-to-audit-request.v1, signatureStrategy: drata-hmac-sha256, replayProtection: true, fallbackPollMinutes: 60 }
fieldMappings:
  - { objectType: contract_review, requiredLogicalFields: [contract.id, contract.version, contract.clauseIds, playbook.version, contract.legalOwnerId], optionalLogicalFields: [contract.parties, contract.jurisdictionScope, contract.accountId] }
  - { objectType: security_questionnaire, requiredLogicalFields: [questionnaire.id, questionnaire.version, account.id, questionnaire.questionIds, questionnaire.securityOwnerId], optionalLogicalFields: [questionnaire.dueAt, questionnaire.libraryVersion] }
  - { objectType: audit_evidence_request, requiredLogicalFields: [request.id, control.id, evidence.window, evidence.requiredArtifactIds, evidence.ownerId], optionalLogicalFields: [request.framework, request.requestor, evidence.freshnessPolicy] }
healthCheck: { capability: policy.control.read, sampleQuery: { fields: [controlId, version], limit: 1 }, timeoutMs: 10000 }
supportsBoundedSamples: true
