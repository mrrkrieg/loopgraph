schemaVersion: loopgraph-app-setup/v1alpha1
kind: AppSetup
questions:
  - { key: operatingReviewPolicy, prompt: "Which company review windows, departments, evidence cutoffs, recurring agenda, risks, decisions, owners, and follow-through rules apply?", why: "A bounded review prevents Hermes from mixing stale or incompatible company evidence.", valueType: object, requirement: required, inferFromContext: management.operatingReviewPolicy, confirmWhenInferred: true }
  - { key: metricDefinitions, prompt: "Which metric definitions, versions, owners, baselines, windows, dimensions, and authoritative sources are approved?", why: "Anomaly and value review require stable semantic definitions.", valueType: object, requirement: required, inferFromContext: company.metricDefinitions, confirmWhenInferred: true }
  - { key: materialityPolicy, prompt: "Which absolute, relative, risk, customer, financial, operational, and confidence thresholds make a company anomaly material?", why: "Hermes must use approved materiality and abstain when definitions conflict.", valueType: object, requirement: required, inferFromContext: company.materialityPolicy, confirmWhenInferred: true }
  - { key: decisionPolicy, prompt: "Which decisions, owners, quorum, evidence, deadlines, dissent, expiration, communication, and follow-through rules apply?", why: "Hermes prepares evidence while accountable leadership decides.", valueType: object, requirement: required, inferFromContext: management.decisionPolicy, confirmWhenInferred: true }
  - { key: resourcePolicy, prompt: "Which budget, capacity, headcount, vendor, system, priority, and board decisions require finance, people, legal, or executive approval?", why: "Resource analysis cannot become an autonomous commitment.", valueType: object, requirement: required, inferFromContext: management.resourcePolicy, confirmWhenInferred: true }
  - { key: loopHealthPolicy, prompt: "Which routing, quality, reliability, correction, cost, review-burden, value, outcome, and recurrence thresholds define loop health?", why: "Loop health must join operational quality with realized value and total supervision cost.", valueType: object, requirement: required, inferFromContext: management.loopHealthPolicy, confirmWhenInferred: true }
  - { key: loopValuePolicy, prompt: "How are execution, connector, review, supervision, reliability, failure, and organizational-change costs included in verified loop value?", why: "Activity and gross benefit are not the same as net company value.", valueType: object, requirement: required, inferFromContext: management.loopValuePolicy, confirmWhenInferred: true }
  - { key: systemChangePolicy, prompt: "Which semantic graph, loop, routing, connection, policy, measurement, split, merge, retirement, and promotion changes require which approvals and rollback?", why: "Hermes may propose exact changes but cannot apply or promote them.", valueType: object, requirement: required, inferFromContext: management.systemChangePolicy, confirmWhenInferred: true }
  - { key: canonicalMappings, prompt: "How do metrics, reviews, loops, departments, decisions, constraints, resource plans, failure patterns, and outcomes map to canonical company objects?", why: "Shared identity prevents duplicate or contradictory management problems.", valueType: object, requirement: required, inferFromContext: company.canonicalObjectMappings, confirmWhenInferred: true }
  - { key: decisionBoundaries, prompt: "Which strategy, budget, hiring, priority, legal, security, board, and high-risk customer decisions are non-delegable?", why: "The app must encode leadership accountability and expert boundaries.", valueType: object, requirement: required, inferFromContext: management.decisionBoundaries, confirmWhenInferred: true }
  - { key: escalationOwners, prompt: "Who owns company operations, finance, people, legal, department outcomes, loop health, metric definitions, and emergency holds?", why: "Every conflict, abstention, and high-risk proposal needs one accountable route.", valueType: object, requirement: required, inferFromContext: management.escalationOwners, confirmWhenInferred: true }
  - { key: outcomeWindows, prompt: "Which windows prove decision execution, constraint movement, resource impact, loop value, system-change effect, and failure recurrence?", why: "Management learning must come from realized outcomes and original assumptions.", valueType: object, requirement: required, inferFromContext: management.outcomeWindows, confirmWhenInferred: true }
