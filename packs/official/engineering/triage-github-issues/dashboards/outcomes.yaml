schemaVersion: loopgraph-app-dashboard/v1alpha1
id: github-issue-triage-outcomes
metrics:
  - { id: issue_triage_latency_minutes, direction: decrease, description: Time from issue creation to accountable triage. }
  - { id: security_escalation_precision, direction: increase, description: Security escalations confirmed by the accountable reviewer. }
  - { id: classification_correction_rate, direction: decrease, description: Triage decisions corrected by maintainers. }
  - { id: maintainer_review_minutes, direction: decrease, description: Human review burden per issue. }
  - { id: duplicate_issue_work_rate, direction: decrease, description: Duplicate deliveries or matched issues suppressed before creating work. }
