schemaVersion: loopgraph-connector-recipe/v1alpha1
id: github-linear-slack
providerId: github
providerFamily: github
displayName: GitHub + Linear + Slack
capabilities:
  - { logicalCapability: project.issue.read, providerOperation: github.issues.get, minimumScopes: [issues:read], authority: read, risk: low }
  - { logicalCapability: project.issue.update, providerOperation: github.issues.update, minimumScopes: [issues:write], authority: approve, risk: high }
  - { logicalCapability: project.issue.create, providerOperation: linear.issues.create, minimumScopes: [issues:create], authority: approve, risk: medium }
  - { logicalCapability: messaging.channel.post, providerOperation: slack.chat.postMessage, minimumScopes: [chat:write], authority: approve, risk: medium }
eventSources:
  - { eventFamily: github.issue_opened, providerEvent: issues.opened, transport: webhook, normalizationTransformer: github.issue-to-repository-issue.v1, signatureStrategy: github-hmac-sha256, replayProtection: true, fallbackPollMinutes: 15 }
fieldMappings:
  - objectType: repository_issue
    providerId: github
    requiredLogicalFields: [issue.id, issue.title, issue.body]
    optionalLogicalFields: [issue.labels, issue.author, issue.repository, issue.createdAt, issue.assignees]
healthCheck:
  capability: project.issue.read
  sampleQuery: { state: open, perPage: 1 }
  timeoutMs: 10000
supportsBoundedSamples: true
