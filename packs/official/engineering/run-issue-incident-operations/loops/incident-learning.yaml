schemaVersion: loopgraph-app-loop/v1alpha1
kind: AppLoop
metadata: { id: engineering-incident-learning, name: Incident Learning, version: 1.0.0, description: "Connect incident cause, response, customer impact, corrective work, releases, and recurrence.", department: engineering, ownerRole: engineering_manager, tags: [incident, learning, recurrence] }
trigger: { type: event, source: "*", event: engineering.incident_resolved }
input: { requiredFields: [normalizedPayload.incidentId, normalizedPayload.resolvedAt, normalizedPayload.resolutionEvidenceRefs], subjectTypes: [incident], fixtures: [] }
routine:
  - { id: assemble, name: Assemble incident record, actor: system, type: observe, description: "Load timeline, severity, impact, mitigation, root-cause confidence, and corrective work." }
  - { id: assess, name: Assess learning evidence, actor: agent, type: assess, description: "Separate contributing conditions, detection gaps, response gaps, and unsupported causality." }
  - { id: prepare, name: Prepare prevention work, actor: agent, type: prepare, description: "Prepare bounded corrective work and outcome measures for approval." }
  - { id: learn, name: Measure recurrence, actor: system, type: learn, description: "Return completion, release, recurrence, and detection-quality evidence." }
capabilities:
  - { key: incident.record.read, authority: read, risk: high, required: true, purpose: Read incident and recurrence evidence., customerFacing: false }
  - { key: deployment.release.read, authority: read, risk: medium, required: true, purpose: Read mitigation and corrective release evidence., customerFacing: false }
  - { key: project.issue.read, authority: read, risk: low, required: true, purpose: Read corrective work and ownership., customerFacing: false }
skills: [engineering-incident-synthesis, engineering-implementation-planning]
outcomes:
  - { metric: incident_recurrence_rate, description: Resolved incident classes recurring after corrective work., direction: decrease, sourceCapability: incident.record.read }
  - { metric: corrective_action_completion_rate, description: Accountable corrective work completed with verifier evidence., direction: increase, sourceCapability: project.issue.read }
routing:
  schemaVersion: routing-contract/v1alpha1
  problemTypes: [engineering.incident_learning]
  accepts: [{ sourcePattern: "*", eventTypePattern: engineering.incident_resolved, subjectTypes: [incident], requiredFields: [normalizedPayload.incidentId, normalizedPayload.resolvedAt, normalizedPayload.resolutionEvidenceRefs], reason: A resolved incident has durable resolution evidence for learning. }]
  excludes: [{ sourcePattern: "*", eventTypePattern: engineering.incident_detected, subjectTypes: [], fields: [], reason: An active incident is not ready for final learning. }]
  inputMapping: { incidentId: normalizedPayload.incidentId, resolvedAt: normalizedPayload.resolvedAt }
  priority: 80
  minimumConfidence: 0.92
  ambiguityPolicy: request_human
  noMatchPolicy: unhandled
  fanoutPolicy: { mode: none, maxRoutes: 1, requiresIndependentProblems: true }
  cooldown: { seconds: 0, dedupeWindowSeconds: 604800 }
  concurrency: { maxActive: 20, strategy: append_evidence }
  activationMode: shadow
  lifecycleEvents: [loopgraph.run.completed, loopgraph.outcome.observed]
  requiredConnections: [incident.record.read, deployment.release.read, project.issue.read]
  examples: { shouldRoute: ["A resolved incident has resolution evidence."], shouldNotRoute: ["Root cause is asserted without evidence."] }
policy: { forbiddenActions: [], escalationOwner: engineering_manager, escalationSla: 3d, separateCustomerFacingApproval: true }
