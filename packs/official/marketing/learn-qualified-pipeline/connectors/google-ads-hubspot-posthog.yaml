schemaVersion: loopgraph-connector-recipe/v1alpha1
id: google-ads-hubspot-posthog
providerId: google_ads
providerFamily: google_ads
displayName: Google Ads + HubSpot + PostHog
capabilities:
  - { logicalCapability: ads.campaign.read, providerOperation: google-ads.campaigns.read, minimumScopes: [adwords], authority: read, risk: low }
  - { logicalCapability: crm.lead.read, providerOperation: hubspot.contacts.read, minimumScopes: [crm.objects.contacts.read], authority: read, risk: low }
  - { logicalCapability: crm.opportunity.read, providerOperation: hubspot.deals.read, minimumScopes: [crm.objects.deals.read], authority: read, risk: low }
  - { logicalCapability: analytics.event.query, providerOperation: posthog.insights.query, minimumScopes: [query:read], authority: read, risk: medium }
  - { logicalCapability: ads.campaign.update, providerOperation: google-ads.campaigns.update, minimumScopes: [adwords], authority: approve, risk: high }
  - { logicalCapability: marketing.content.draft, providerOperation: google-ads.assets.prepare, minimumScopes: [adwords], authority: approve, risk: high }
  - { logicalCapability: collaboration.message.draft, providerOperation: slack.messages.draft, minimumScopes: [chat:write], authority: approve, risk: medium }
eventSources:
  - { eventFamily: marketing.campaign_window_closed, providerEvent: campaign.performanceWindow, transport: poll, normalizationTransformer: google-ads.campaign-to-learning-window.v1, signatureStrategy: oauth-response-bound, replayProtection: true, fallbackPollMinutes: 60 }
  - { eventFamily: marketing.pipeline_outcome_observed, providerEvent: deal.propertyChange, transport: webhook, normalizationTransformer: hubspot.deal-to-campaign-outcome.v1, signatureStrategy: hubspot-v3-signature, replayProtection: true, fallbackPollMinutes: 60 }
fieldMappings:
  - { objectType: campaign, requiredLogicalFields: [campaign.id, campaign.channel, campaign.spend, campaign.windowStart, campaign.windowEnd], optionalLogicalFields: [campaign.messageId, campaign.audienceId, campaign.clicks, campaign.conversions] }
  - { objectType: attributed_lead, requiredLogicalFields: [lead.id, lead.campaignId, lead.createdAt], optionalLogicalFields: [lead.accountId, lead.qualification, lead.segment] }
  - { objectType: pipeline_outcome, requiredLogicalFields: [opportunity.id, opportunity.stage, opportunity.campaignId], optionalLogicalFields: [opportunity.amount, opportunity.activatedAt, opportunity.closedAt] }
healthCheck:
  capability: ads.campaign.read
  sampleQuery: { state: enabled, limit: 1 }
  timeoutMs: 10000
supportsBoundedSamples: true
