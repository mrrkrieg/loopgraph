schemaVersion: loopgraph-app-setup/v1alpha1
kind: AppSetup
questions:
  - { key: qualificationDefinition, prompt: What exactly makes a campaign lead qualified?, why: Hermes needs the company value contract instead of ad-platform conversion labels., valueType: object, requirement: required, inferFromContext: marketing.qualificationDefinition, confirmWhenInferred: true }
  - { key: attributionPolicy, prompt: Which attribution model and campaign identity fields are authoritative?, why: Durable attribution is required before outcomes can return to the right campaign., valueType: object, requirement: required, inferFromContext: marketing.attributionPolicy, confirmWhenInferred: true }
  - { key: attributionWindow, prompt: What attribution and pipeline observation windows should each campaign type use?, why: Downstream outcomes often arrive later than ad-platform conversions., valueType: object, requirement: required, inferFromContext: marketing.attributionWindow, confirmWhenInferred: true }
  - { key: activationMetric, prompt: Which product behavior counts as activation for each relevant segment?, why: Product value must be defined before campaign quality can be measured., valueType: object, requirement: required, inferFromContext: product.activationMetric, confirmWhenInferred: true }
  - { key: pipelineStages, prompt: Which CRM stages count as qualified pipeline and revenue outcomes?, why: Campaign learning must use the same definitions as Sales and Finance., valueType: object, requirement: required, inferFromContext: sales.pipelineStages, confirmWhenInferred: true }
  - { key: budgetBounds, prompt: "Which budget, bid, and status changes may Hermes prepare for review?", why: "Allocation proposals need explicit bounds and never receive autonomous authority.", valueType: object, requirement: required, inferFromContext: marketing.budgetBounds, confirmWhenInferred: true }
  - { key: protectedSegments, prompt: "Which brands, markets, audiences, or regulated claims require stricter review?", why: "Protected scopes must remain excluded from ordinary campaign proposals.", valueType: object, requirement: required, inferFromContext: marketing.protectedSegments, confirmWhenInferred: true }
  - { key: owners, prompt: "Who owns campaign review, attribution, qualification, and allocation approval?", why: "Every cross-department decision needs an accountable reviewer.", valueType: object, requirement: required, inferFromContext: marketing.ownerMapping, confirmWhenInferred: true }
  - { key: primaryMetric, prompt: Which qualified-pipeline-per-dollar metric is primary and what are its guardrails?, why: Hermes needs one decision metric and explicit non-regression constraints., valueType: object, requirement: required, inferFromContext: marketing.primaryMetric, confirmWhenInferred: true }
