schemaVersion: loopgraph-app-setup/v1alpha1
kind: AppSetup
questions:
  - { key: materialityPolicy, prompt: "Which absolute and relative thresholds make a forecast, close, vendor, or receivable issue material?", why: "Hermes must use approved materiality rather than invent importance.", valueType: object, requirement: required, inferFromContext: finance.materialityPolicy, confirmWhenInferred: true }
  - { key: forecastCadence, prompt: "Which forecast versions, periods, scenarios, currencies, and approved baselines are authoritative?", why: "Variance is meaningless without version and time-window identity.", valueType: object, requirement: required, inferFromContext: finance.forecastCadence, confirmWhenInferred: true }
  - { key: approvalPolicy, prompt: "Which approval types, thresholds, owners, SLAs, and separation-of-duties rules apply?", why: "Hermes must diagnose bottlenecks without exercising approval authority.", valueType: object, requirement: required, inferFromContext: finance.approvalPolicy, confirmWhenInferred: true }
  - { key: closePolicy, prompt: "Which period-close checklist, reconciliation evidence, control exceptions, and owners are required?", why: "Close readiness needs company-specific evidence and controller ownership.", valueType: object, requirement: required, inferFromContext: finance.closePolicy, confirmWhenInferred: true }
  - { key: receivablePolicy, prompt: "Which invoice states, dispute rules, account tiers, grace periods, and communication boundaries govern collections?", why: "Collection work affects customer relationships and must stay policy-bound.", valueType: object, requirement: required, inferFromContext: finance.receivablePolicy, confirmWhenInferred: true }
  - { key: vendorPolicy, prompt: "Which spend, usage, renewal, security, concentration, and owner evidence is required for vendor review?", why: "Vendor recommendations need current value and control evidence.", valueType: object, requirement: required, inferFromContext: finance.vendorPolicy, confirmWhenInferred: true }
  - { key: resourceDecisionPolicy, prompt: "Which budget and capacity decisions require finance, leadership, people, legal, or board approval?", why: "Hermes prepares tradeoffs but accountable owners retain authority.", valueType: object, requirement: required, inferFromContext: finance.resourceDecisionPolicy, confirmWhenInferred: true }
  - { key: canonicalMappings, prompt: "How do provider forecasts, entities, invoices, accounts, vendors, contracts, approvals, and resource plans map to canonical company objects?", why: "Shared object identity prevents duplicate or conflicting finance problems.", valueType: object, requirement: required, inferFromContext: company.canonicalObjectMappings, confirmWhenInferred: true }
  - { key: escalationOwners, prompt: "Who owns finance control, accounting judgment, procurement, receivables, operations, and executive resource decisions?", why: "Every abstention and high-risk action needs one accountable human route.", valueType: object, requirement: required, inferFromContext: finance.escalationOwners, confirmWhenInferred: true }
  - { key: outcomeWindows, prompt: "Which windows prove forecast accuracy, approval recovery, close completion, cash realization, vendor value, and allocation impact?", why: "The app must learn from realized outcomes rather than claim value from activity.", valueType: object, requirement: required, inferFromContext: finance.outcomeWindows, confirmWhenInferred: true }
  - { key: protectedDataPolicy, prompt: "Which bank, payroll, tax, customer, contract, and workforce fields are restricted or prohibited?", why: "Financial and workforce data must be minimized and access-controlled.", valueType: object, requirement: required, inferFromContext: company.dataClassificationPolicy, confirmWhenInferred: true }
