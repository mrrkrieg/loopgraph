schemaVersion: loopgraph-app-setup/v1alpha1
kind: AppSetup
questions:
  - { key: productAreas, prompt: Which product areas and workflows should Hermes analyze?, why: Every feedback and problem decision needs a stable product boundary., valueType: object, requirement: required, inferFromContext: product.areasAndWorkflows, confirmWhenInferred: true }
  - { key: customerSegments, prompt: Which customer or user segments should evidence be compared across?, why: A problem may be material for one segment and irrelevant for another., valueType: object, requirement: required, inferFromContext: company.customerSegments, confirmWhenInferred: true }
  - { key: evidenceThresholds, prompt: "What recurrence, source diversity, and usage evidence is required to validate a problem?", why: "Explicit evidence thresholds prevent anecdotes from becoming roadmap work.", valueType: object, requirement: required, inferFromContext: product.evidenceThresholds, confirmWhenInferred: true }
  - { key: defectPolicy, prompt: "Which signals classify a recurring defect rather than onboarding, support, or usability friction?", why: "Bug work must follow a distinct, reproducible evidence contract.", valueType: object, requirement: required, inferFromContext: product.defectPolicy, confirmWhenInferred: true }
  - { key: owners, prompt: "Who owns each product area, defect class, and final roadmap judgment?", why: "Hermes needs accountable routes and escalation owners.", valueType: object, requirement: required, inferFromContext: product.ownership, confirmWhenInferred: true }
  - { key: activationMetric, prompt: Which product behavior is the primary success measure for this app?, why: Release learning needs a predeclared business outcome rather than activity metrics., valueType: object, requirement: required, inferFromContext: product.activationMetric, confirmWhenInferred: true }
  - { key: guardrails, prompt: "Which support, reliability, privacy, or segment guardrails must not regress?", why: "A release is not successful if it improves one metric while creating unacceptable harm.", valueType: object, requirement: required, inferFromContext: product.releaseGuardrails, confirmWhenInferred: true }
  - { key: measurementWindows, prompt: What baseline and post-release windows should outcome reviews use?, why: Consistent windows make release learning comparable and auditable., valueType: object, requirement: required, inferFromContext: product.measurementWindows, confirmWhenInferred: true }
  - { key: issuePolicy, prompt: Should Hermes stop at a brief or prepare exact issue create/update actions for approval?, why: Provider-write authority must be explicit and remains approval-bound., valueType: string, requirement: required, inferFromContext: policy.productIssueAutomation, confirmWhenInferred: true, defaultValue: prepare_for_approval }
