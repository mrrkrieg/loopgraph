schemaVersion: loopgraph-company-blueprint-catalog-source/v1alpha1
blueprints:
  - id: loopgraph.company.saas-operating-system
    version: 1.0.0
    name: SaaS Company Operating System
    summary: Connect customer, product, revenue, reliability, people, compliance, finance, and management loops under one evidence-aware Hermes Brain.
    companyProfile: A software company with recurring revenue, a digital product, cross-functional customer ownership, and accountable human approval for material decisions.
    businessOutcomes:
      - Give Hermes a consistent company object model and explicit cross-department evidence contracts.
      - Connect local automation outcomes to customer, revenue, reliability, financial, and management results.
      - Make every event, routing decision, App, task, approval, outcome, and learning return inspectable without granting hidden authority.
    defaultPackId: loopgraph.department.product
    packs:
      - packId: loopgraph.department.product
        role: foundation
        installOrder: 1
        reason: Establish the product catalog, customer evidence, validated problem, roadmap, and release-learning context.
        dependsOn: []
      - packId: loopgraph.department.sales
        role: foundation
        installOrder: 2
        reason: Establish canonical account, contact, opportunity, qualification, ownership, and pipeline context.
        dependsOn: []
      - packId: loopgraph.department.marketing
        role: operating
        installOrder: 3
        reason: Connect campaign learning to the canonical lead, account, opportunity, and qualified-pipeline outcomes from Sales.
        dependsOn: [loopgraph.department.sales]
      - packId: loopgraph.department.customer-success
        role: operating
        installOrder: 4
        reason: Extend canonical accounts with service, health, strategic-risk, renewal, and customer-outcome evidence.
        dependsOn: [loopgraph.department.sales]
      - packId: loopgraph.department.engineering
        role: operating
        installOrder: 5
        reason: Connect issues, services, incidents, customer impact, fixes, and release learning to Product.
        dependsOn: [loopgraph.department.product]
      - packId: loopgraph.department.ops-finance
        role: operating
        installOrder: 6
        reason: Join pipeline, billing, forecast, approval, close, and capacity evidence into controlled financial operations.
        dependsOn: [loopgraph.department.sales]
      - packId: loopgraph.department.hr-talent
        role: operating
        installOrder: 7
        reason: Establish accountable people operations and capacity evidence without automating employment judgment.
        dependsOn: []
      - packId: loopgraph.department.legal-compliance
        role: operating
        installOrder: 8
        reason: Establish expert-owned contracts, obligations, controls, exceptions, incidents, access, and audit evidence.
        dependsOn: []
      - packId: loopgraph.department.management
        role: oversight
        installOrder: 9
        reason: Consume verified department outcomes and constraints for reviews, decisions, resource allocation, and follow-through.
        dependsOn: [loopgraph.department.product, loopgraph.department.sales, loopgraph.department.ops-finance]
    sharedContextKeys:
      - company.identity
      - company.customer_segments
      - company.account_identity_policy
      - company.department_owners
      - company.approval_roles
      - company.operating_metrics
      - company.risk_policy
    objectContracts:
      - objectType: company.account
        description: One canonical customer or prospect organization shared across revenue, service, finance, and management evidence.
        identityKeys: [crm.account_id, company.domain]
        producerPackIds: [loopgraph.department.sales, loopgraph.department.customer-success]
        consumerPackIds: [loopgraph.department.marketing, loopgraph.department.ops-finance, loopgraph.department.management]
        requiredEvidenceFields: [account.id, account.status, account.owner_id, evidence.observed_at, evidence.provider_ref]
      - objectType: company.campaign
        description: One canonical campaign and attribution identity linked to downstream qualification and customer outcomes.
        identityKeys: [marketing.campaign_id, marketing.channel_id]
        producerPackIds: [loopgraph.department.marketing]
        consumerPackIds: [loopgraph.department.sales, loopgraph.department.management]
        requiredEvidenceFields: [campaign.id, campaign.channel, campaign.cost, evidence.observed_at, evidence.provider_ref]
      - objectType: company.product_problem
        description: A validated recurring customer or product problem with traceable evidence, affected segment, and release learning.
        identityKeys: [product.problem_id]
        producerPackIds: [loopgraph.department.product, loopgraph.department.customer-success]
        consumerPackIds: [loopgraph.department.engineering, loopgraph.department.management]
        requiredEvidenceFields: [problem.id, problem.segment, problem.severity, evidence.observed_at, evidence.provider_ref]
      - objectType: company.incident
        description: One production incident linked to service, customer impact, communication, remediation, and recurrence evidence.
        identityKeys: [incident.provider_id, incident.service_id]
        producerPackIds: [loopgraph.department.engineering]
        consumerPackIds: [loopgraph.department.customer-success, loopgraph.department.legal-compliance, loopgraph.department.management]
        requiredEvidenceFields: [incident.id, incident.service_id, incident.severity, incident.started_at, evidence.provider_ref]
      - objectType: company.contract
        description: One customer, vendor, or employment agreement and its obligations, renewal, approval, and evidence state.
        identityKeys: [contract.repository_id, contract.external_id]
        producerPackIds: [loopgraph.department.legal-compliance, loopgraph.department.customer-success]
        consumerPackIds: [loopgraph.department.sales, loopgraph.department.ops-finance, loopgraph.department.hr-talent, loopgraph.department.management]
        requiredEvidenceFields: [contract.id, contract.type, contract.status, contract.owner_id, evidence.provider_ref]
      - objectType: company.forecast
        description: One versioned operating or financial forecast with assumptions, variance evidence, approval, and accountable owner.
        identityKeys: [finance.forecast_id, finance.period]
        producerPackIds: [loopgraph.department.ops-finance]
        consumerPackIds: [loopgraph.department.management]
        requiredEvidenceFields: [forecast.id, forecast.period, forecast.version, forecast.owner_id, evidence.observed_at]
      - objectType: company.decision
        description: One accountable company decision linked to evidence, alternatives, approval, resources, owners, and observed outcomes.
        identityKeys: [management.decision_id]
        producerPackIds: [loopgraph.department.management]
        consumerPackIds: [loopgraph.department.product, loopgraph.department.sales, loopgraph.department.marketing, loopgraph.department.customer-success, loopgraph.department.engineering, loopgraph.department.ops-finance, loopgraph.department.hr-talent, loopgraph.department.legal-compliance]
        requiredEvidenceFields: [decision.id, decision.owner_id, decision.status, decision.decided_at, evidence.source_refs]
    topology:
      - id: company.marketing-sales-qualified-pipeline
        sourcePackId: loopgraph.department.marketing
        targetPackId: loopgraph.department.sales
        type: evidence_handoff
        objectType: company.campaign
        reason: Campaign responses enter Sales only with campaign identity and qualification context.
        condition: A trusted CRM or attribution event links the person and account to the campaign.
      - id: company.sales-marketing-pipeline-learning
        sourcePackId: loopgraph.department.sales
        targetPackId: loopgraph.department.marketing
        type: learning_return
        objectType: company.campaign
        reason: Qualification, opportunity, win, and loss outcomes correct campaign-quality assumptions.
        condition: The downstream outcome resolves to the same canonical campaign and account.
      - id: company.customer-success-product-problem
        sourcePackId: loopgraph.department.customer-success
        targetPackId: loopgraph.department.product
        type: evidence_handoff
        objectType: company.product_problem
        reason: Repeated support and account evidence can support one validated product problem instead of isolated feature requests.
        condition: Evidence repeats across customers or materially affects a strategic account and retains source references.
      - id: company.product-engineering-implementation
        sourcePackId: loopgraph.department.product
        targetPackId: loopgraph.department.engineering
        type: support_request
        objectType: company.product_problem
        reason: An approved product problem can request scoped engineering planning without creating implementation authority.
        condition: Product supplies acceptance evidence, priority, owner, and an approved decision reference.
      - id: company.engineering-product-release-learning
        sourcePackId: loopgraph.department.engineering
        targetPackId: loopgraph.department.product
        type: learning_return
        objectType: company.product_problem
        reason: Delivery, quality, adoption, and recurrence evidence return to the product problem and roadmap assumptions.
        condition: A release or prevention change is linked to the original validated product problem.
      - id: company.engineering-customer-success-incident-impact
        sourcePackId: loopgraph.department.engineering
        targetPackId: loopgraph.department.customer-success
        type: support_request
        objectType: company.incident
        reason: A production incident can request governed account-impact review and customer communication preparation.
        condition: Customer impact is known or reasonably suspected and the incident severity permits fan-out.
      - id: company.customer-success-engineering-impact-learning
        sourcePackId: loopgraph.department.customer-success
        targetPackId: loopgraph.department.engineering
        type: learning_return
        objectType: company.incident
        reason: Verified customer impact, communication outcomes, and retention effects improve severity and incident-learning policy.
        condition: The account evidence resolves to the same canonical incident and service.
      - id: company.sales-finance-forecast-input
        sourcePackId: loopgraph.department.sales
        targetPackId: loopgraph.department.ops-finance
        type: evidence_handoff
        objectType: company.account
        reason: Qualified pipeline and committed revenue become traceable forecast evidence rather than copied spreadsheet assumptions.
        condition: Opportunity stage, amount, close period, owner, and account identity satisfy Finance policy.
      - id: company.legal-finance-contract-obligation
        sourcePackId: loopgraph.department.legal-compliance
        targetPackId: loopgraph.department.ops-finance
        type: evidence_handoff
        objectType: company.contract
        reason: Approved obligations and exceptions become financial-control evidence without transferring legal judgment.
        condition: The contract version and expert approval are current and content-bound.
      - id: company.finance-management-variance
        sourcePackId: loopgraph.department.ops-finance
        targetPackId: loopgraph.department.management
        type: evidence_handoff
        objectType: company.forecast
        reason: Material forecast variance and approval bottlenecks enter management review with traceable assumptions and controls.
        condition: Variance crosses the configured materiality threshold or a control deadline is at risk.
      - id: company.hr-management-capacity
        sourcePackId: loopgraph.department.hr-talent
        targetPackId: loopgraph.department.management
        type: evidence_handoff
        objectType: company.decision
        reason: Aggregated capacity and people-operation constraints inform resource allocation without exposing sensitive employee records.
        condition: Evidence is aggregated, policy-approved, and contains no prohibited employment inference.
      - id: company.management-departments-decision-return
        sourcePackId: loopgraph.department.management
        targetPackId: loopgraph.department.product
        type: learning_return
        objectType: company.decision
        reason: Approved priorities, resources, owners, and success conditions return to department execution as an accountable decision.
        condition: The decision has an owner, approval receipt, effective date, and measurable outcome contract.
      - id: company.management-sales-decision-return
        sourcePackId: loopgraph.department.management
        targetPackId: loopgraph.department.sales
        type: learning_return
        objectType: company.decision
        reason: Approved revenue priorities, ownership, and resource constraints return to Sales as accountable operating context.
        condition: The decision has an owner, approval receipt, effective date, and measurable outcome contract.
      - id: company.management-marketing-decision-return
        sourcePackId: loopgraph.department.management
        targetPackId: loopgraph.department.marketing
        type: learning_return
        objectType: company.decision
        reason: Approved channel priorities, budgets, and success conditions return to Marketing as accountable operating context.
        condition: The decision has an owner, approval receipt, effective date, and measurable outcome contract.
      - id: company.management-customer-success-decision-return
        sourcePackId: loopgraph.department.management
        targetPackId: loopgraph.department.customer-success
        type: learning_return
        objectType: company.decision
        reason: Approved customer priorities, service commitments, and resources return to Customer Success as accountable operating context.
        condition: The decision has an owner, approval receipt, effective date, and measurable outcome contract.
      - id: company.management-engineering-decision-return
        sourcePackId: loopgraph.department.management
        targetPackId: loopgraph.department.engineering
        type: learning_return
        objectType: company.decision
        reason: Approved reliability priorities, capacity, and risk tolerance return to Engineering as accountable operating context.
        condition: The decision has an owner, approval receipt, effective date, and measurable outcome contract.
      - id: company.management-finance-decision-return
        sourcePackId: loopgraph.department.management
        targetPackId: loopgraph.department.ops-finance
        type: learning_return
        objectType: company.decision
        reason: Approved resource allocation and operating constraints return to Finance as accountable forecast context.
        condition: The decision has an owner, approval receipt, effective date, and measurable outcome contract.
      - id: company.management-hr-decision-return
        sourcePackId: loopgraph.department.management
        targetPackId: loopgraph.department.hr-talent
        type: learning_return
        objectType: company.decision
        reason: Approved capacity plans and role priorities return to People Operations without transferring employment judgment.
        condition: The decision is policy-approved, aggregate, and contains no prohibited employment inference.
      - id: company.management-legal-decision-return
        sourcePackId: loopgraph.department.management
        targetPackId: loopgraph.department.legal-compliance
        type: learning_return
        objectType: company.decision
        reason: Approved company priorities and risk posture return to Legal and Compliance as context without transferring expert judgment.
        condition: The decision has an owner, approval receipt, effective date, and explicit expert-review boundary.
