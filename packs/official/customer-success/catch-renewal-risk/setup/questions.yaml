schemaVersion: loopgraph-app-setup/v1alpha1
kind: AppSetup
questions:
  - { key: accountTiers, prompt: Which account tiers and strategic-account rules should Hermes use?, why: Risk thresholds and escalation differ by account tier., valueType: object, requirement: required, inferFromContext: customerSuccess.accountTiers, confirmWhenInferred: true }
  - { key: renewalWindows, prompt: Which renewal windows apply by contract and account tier?, why: Renewal risk requires verified timing and company policy., valueType: object, requirement: required, inferFromContext: customerSuccess.renewalWindows, confirmWhenInferred: true }
  - { key: riskThresholds, prompt: "Which adoption, support, billing, and relationship signals define risk?", why: "Hermes must use explicit multidimensional thresholds rather than invent a health score.", valueType: object, requirement: required, inferFromContext: customerSuccess.riskThresholds, confirmWhenInferred: true }
  - { key: ownerMapping, prompt: "Who owns each account, renewal, support escalation, and strategic recovery?", why: "Every problem and prepared action needs an accountable human.", valueType: object, requirement: required, inferFromContext: customerSuccess.ownerMapping, confirmWhenInferred: true }
  - { key: customerGoals, prompt: Where are authoritative customer goals and success plans recorded?, why: Health and QBR outcomes must be compared with customer-defined goals., valueType: object, requirement: required, inferFromContext: customerSuccess.customerGoals, confirmWhenInferred: true }
  - { key: escalationPolicy, prompt: Which conditions permit strategic-account fan-out and executive escalation?, why: Cross-department fan-out must be explicit and bounded., valueType: object, requirement: required, inferFromContext: customerSuccess.escalationPolicy, confirmWhenInferred: true }
  - { key: communicationPolicy, prompt: Which internal and customer-facing channels may be prepared for review?, why: Audience and approval scope must be explicit., valueType: object, requirement: required, inferFromContext: customerSuccess.communicationPolicy, confirmWhenInferred: true }
  - { key: outcomeWindow, prompt: What period should Hermes use to measure recovery and renewal outcomes?, why: Shared learning requires a predeclared observation window., valueType: object, requirement: required, inferFromContext: customerSuccess.outcomeWindow, confirmWhenInferred: true }
