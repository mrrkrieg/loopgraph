schemaVersion: loopgraph-app-setup/v1alpha1
kind: AppSetup
questions:
  - { key: strategicAccountDefinition, prompt: Which tiers or attributes define a strategic account?, why: The app must use the company definition rather than infer importance from provider data., valueType: object, requirement: required, inferFromContext: customerSuccess.accountTiers, confirmWhenInferred: true }
  - { key: renewalWindows, prompt: Which renewal windows change urgency?, why: Commercial timing is part of the risk evidence and response SLA., valueType: object, requirement: required, inferFromContext: customerSuccess.renewalWindows, confirmWhenInferred: true }
  - { key: riskThresholds, prompt: "Which service, adoption, relationship, and commercial signals create risk?", why: Hermes needs explicit thresholds and exclusion rules before routing., valueType: object, requirement: required, inferFromContext: customerSuccess.riskThresholds, confirmWhenInferred: true }
  - { key: accountOwnership, prompt: Who owns strategic accounts and cross-functional escalation?, why: Every prepared action needs an accountable owner and reviewer., valueType: object, requirement: required, inferFromContext: customerSuccess.accountOwnership, confirmWhenInferred: true }
  - { key: communicationPolicy, prompt: What can Hermes draft and which commitments are forbidden?, why: Customer communication must stay inside approved authority., valueType: object, requirement: required, inferFromContext: policy.strategicAccountCommunication, confirmWhenInferred: true }
  - { key: responseSlaMinutes, prompt: How quickly should confirmed strategic risk receive accountable ownership?, why: Loopgraph measures the response against this operating objective., valueType: number, requirement: required, inferFromContext: customerSuccess.strategicRiskSlaMinutes, confirmWhenInferred: true, defaultValue: 15 }
  - { key: escalationChannel, prompt: Where should reviewed cross-functional escalations go?, why: Internal notification needs an explicit approved destination., valueType: string, requirement: conditional, condition: messaging.channel.post is connected, inferFromContext: customerSuccess.escalationChannel, confirmWhenInferred: true }
