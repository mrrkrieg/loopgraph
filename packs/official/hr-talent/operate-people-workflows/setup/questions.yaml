schemaVersion: loopgraph-app-setup/v1alpha1
kind: AppSetup
questions:
  - { key: approvedSystems, prompt: "Which ATS, HRIS, onboarding, performance, survey, project, and calendar systems are approved sources?", why: "Hermes needs an explicit provider and purpose allowlist before people data can enter a loop.", valueType: object, requirement: required, inferFromContext: people.approvedSystems, confirmWhenInferred: true }
  - { key: dataPolicy, prompt: "Which people fields are allowed, restricted, prohibited, aggregate-only, consent-dependent, or region-bound for each workflow?", why: "Data minimization and purpose limitation must be enforceable before installation.", valueType: object, requirement: required, inferFromContext: people.dataPolicy, confirmWhenInferred: true }
  - { key: decisionBoundaries, prompt: "Which ranking, hiring, rejection, compensation, promotion, performance, discipline, termination, retention, and communication decisions are forbidden or human-owned?", why: "The app must encode employment-decision boundaries rather than infer them from usage.", valueType: object, requirement: required, inferFromContext: people.decisionBoundaries, confirmWhenInferred: true }
  - { key: candidateProcessPolicy, prompt: "Which candidate stages, SLAs, required feedback, scheduling rules, owners, consent rules, and experience measures define a process stall?", why: "Hermes diagnoses process friction without judging candidate quality.", valueType: object, requirement: required, inferFromContext: people.candidateProcessPolicy, confirmWhenInferred: true }
  - { key: onboardingPolicy, prompt: "Which onboarding plans, task dependencies, access and equipment requirements, due dates, and owners are authoritative?", why: "A versioned plan prevents generic or person-judging onboarding automation.", valueType: object, requirement: required, inferFromContext: people.onboardingPolicy, confirmWhenInferred: true }
  - { key: managerSupportPolicy, prompt: "Which manager-support evidence is approved, aggregate-only, consented, attributable, and suitable for coaching preparation?", why: "Manager support must not become private-message surveillance or hidden scoring.", valueType: object, requirement: required, inferFromContext: people.managerSupportPolicy, confirmWhenInferred: true }
  - { key: retentionReviewPolicy, prompt: "Is retention review enabled, which signals are approved, and which qualified reviewer must own every case?", why: "The sensitive module is disabled by default and cannot predict individual attrition.", valueType: object, requirement: conditional, inferFromContext: people.retentionReviewPolicy, confirmWhenInferred: true, condition: retention-review module is explicitly enabled }
  - { key: performanceReviewPolicy, prompt: "Which review periods, declared goals, authored evidence, fairness checks, reviewers, and evidence-retention rules apply?", why: "Hermes may prepare evidence but cannot create a rating or employment recommendation.", valueType: object, requirement: required, inferFromContext: people.reviewPolicy, confirmWhenInferred: true }
  - { key: canonicalMappings, prompt: "How do provider candidates, requisitions, employees, managers, teams, plans, tasks, goals, and review periods map to canonical company objects?", why: "Shared identity prevents duplicate or cross-person problems.", valueType: object, requirement: required, inferFromContext: company.canonicalObjectMappings, confirmWhenInferred: true }
  - { key: escalationOwners, prompt: "Who owns recruiting operations, people operations, manager support, privacy, fairness, legal review, and emergency access revocation?", why: "Every abstention, restricted-data event, and sensitive output needs one accountable route.", valueType: object, requirement: required, inferFromContext: people.escalationOwners, confirmWhenInferred: true }
  - { key: outcomeWindows, prompt: "Which windows prove process latency, onboarding completion, review quality, reviewer burden, corrections, fairness, and deletion compliance?", why: "The app must prove process value without optimizing an agent-created people score.", valueType: object, requirement: required, inferFromContext: people.outcomeWindows, confirmWhenInferred: true }
  - { key: retentionDeletionPolicy, prompt: "How long may prompts, evidence, traces, receipts, exports, and outcome records be retained, and how are access and deletion requests handled?", why: "People-data lifecycle controls must apply across the entire Loopgraph and Hermes path.", valueType: object, requirement: required, inferFromContext: company.dataRetentionPolicy, confirmWhenInferred: true }
