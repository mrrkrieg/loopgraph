schemaVersion: loopgraph-connector-recipe/v1alpha1
id: workday-greenhouse-slack
providerId: workday
providerFamily: workday
displayName: Workday + Greenhouse + Slack
capabilities:
  - { logicalCapability: ats.candidate.read, providerOperation: greenhouse.candidates.read, minimumScopes: [candidates:read, applications:read], authority: read, risk: critical }
  - { logicalCapability: calendar.schedule.read, providerOperation: calendar.interviews.read, minimumScopes: [calendar:read], authority: read, risk: high }
  - { logicalCapability: hris.employee.read, providerOperation: workday.workers.read-bounded, minimumScopes: [workers:read], authority: read, risk: critical }
  - { logicalCapability: onboarding.plan.read, providerOperation: workday.onboarding-plans.read, minimumScopes: [onboarding:read], authority: read, risk: high }
  - { logicalCapability: survey.response.read, providerOperation: survey.aggregate-responses.read, minimumScopes: [survey-aggregate:read], authority: read, risk: critical }
  - { logicalCapability: performance.goal.read, providerOperation: workday.goals.read, minimumScopes: [goals:read], authority: read, risk: critical }
  - { logicalCapability: project.task.read, providerOperation: project.onboarding-tasks.read, minimumScopes: [tasks:read], authority: read, risk: medium }
  - { logicalCapability: project.task.create, providerOperation: project.tasks.create, minimumScopes: [tasks:write], authority: approve, risk: high }
  - { logicalCapability: collaboration.message.draft, providerOperation: slack.messages.draft, minimumScopes: [chat:write], authority: approve, risk: critical }
eventSources:
  - { eventFamily: talent.candidate_stage_stalled, providerEvent: greenhouse.application.stage_stalled, transport: poll, normalizationTransformer: greenhouse.application-to-candidate-process.v1, replayProtection: true, fallbackPollMinutes: 60 }
  - { eventFamily: talent.onboarding_task_overdue, providerEvent: workday.onboarding.task_overdue, transport: webhook, normalizationTransformer: workday.task-to-onboarding-plan.v1, signatureStrategy: workday-hmac-sha256, replayProtection: true, fallbackPollMinutes: 60 }
  - { eventFamily: talent.performance_review_due, providerEvent: workday.performance.review_due, transport: poll, normalizationTransformer: workday.review-to-performance-period.v1, replayProtection: true, fallbackPollMinutes: 1440 }
fieldMappings:
  - { objectType: candidate_process, requiredLogicalFields: [candidate.id, requisition.id, candidate.stage, candidate.ownerId, candidate.stalledSince], optionalLogicalFields: [candidate.missingFeedbackIds, candidate.schedulingState, candidate.consentPolicy] }
  - { objectType: onboarding_plan, requiredLogicalFields: [employee.id, onboarding.planId, onboarding.version, onboarding.managerId, onboarding.missingTaskIds], optionalLogicalFields: [onboarding.startDate, onboarding.dependencies, onboarding.ownerIds] }
  - { objectType: performance_review_period, requiredLogicalFields: [employee.id, manager.id, review.period, review.policyVersion, review.goalEvidenceIds], optionalLogicalFields: [review.authoredEvidenceIds, review.missingEvidenceIds] }
healthCheck: { capability: hris.employee.read, sampleQuery: { fields: [workerId], limit: 1 }, timeoutMs: 10000 }
supportsBoundedSamples: true
