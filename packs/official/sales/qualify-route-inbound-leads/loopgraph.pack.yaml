schemaVersion: loopgraph-pack/v1alpha1
kind: LoopPack
metadata:
  id: loopgraph.sales.qualify-route-inbound-leads
  name: Qualify and Route Inbound Leads
  version: 1.0.0
  summary: Turn inbound demand into governed qualification, routing, follow-up, and measurable learning.
  description: A complete Sales application in which Hermes receives inbound lead events, assembles account evidence, evaluates ICP and intent, routes clear cases, abstains on ambiguity, prepares bounded follow-up, and learns from meetings and pipeline outcomes.
  department: sales
  publisher:
    id: loopgraph
    name: Loopgraph
    verified: true
  license: MIT
  visibility: official
  tags: [sales, inbound, qualification, routing, learning]
  homepage: https://github.com/mrrkrieg/loopgraph
  repository: https://github.com/mrrkrieg/loopgraph
compatibility:
  loopgraph: ">=0.2.0 <1.0.0"
  hermes: ">=1.0.0"
  platforms: [darwin, linux, win32]
dependencies: []
modules:
  - id: account-research
    name: Account research
    description: Enrich and verify the company behind a lead before scoring it.
    defaultEnabled: true
    dependsOn: []
    assets: [loops/account-research.yaml, skills/account-research.yaml]
  - id: governed-follow-up
    name: Governed follow-up
    description: Prepare personalized follow-up while keeping sending blocked by default.
    defaultEnabled: true
    dependsOn: [account-research]
    assets: [loops/follow-up.yaml, skills/personalized-follow-up.yaml]
presets:
  - id: hubspot-gmail-slack
    name: HubSpot + Gmail + Slack
    description: Read and update HubSpot, prepare Gmail drafts, and notify an internal Slack channel.
    path: presets/hubspot-gmail-slack.yaml
    providerFamily: hubspot
  - id: salesforce-outlook-teams
    name: Salesforce + Outlook + Teams
    description: Read and update Salesforce, prepare Outlook drafts, and notify an internal Teams channel.
    path: presets/salesforce-outlook-teams.yaml
    providerFamily: salesforce
permissions:
  - capability: crm.lead.read
    authority: read
    mode: required
    risk: low
    purpose: Read lead identity, lifecycle state, attribution, and qualification fields.
    customerFacing: false
    defaultPolicy: allowed
    dataClasses: [business_contact, crm_activity]
  - capability: crm.account.read
    authority: read
    mode: required
    risk: low
    purpose: Read account attributes and detect existing customers or duplicates.
    customerFacing: false
    defaultPolicy: allowed
    dataClasses: [business_account]
  - capability: enrichment.account.read
    authority: read
    mode: optional
    risk: medium
    purpose: Fill bounded firmographic gaps needed for ICP evaluation.
    customerFacing: false
    defaultPolicy: allowed
    dataClasses: [business_account]
  - capability: crm.lead.update
    authority: approve
    mode: optional
    risk: high
    purpose: Apply an approved qualification, owner, territory, and disposition to the exact lead.
    customerFacing: false
    defaultPolicy: approval_required
    dataClasses: [business_contact, crm_activity]
  - capability: mail.message.draft
    authority: draft
    mode: optional
    risk: medium
    purpose: Prepare a personalized follow-up draft for human review.
    customerFacing: true
    defaultPolicy: allowed
    dataClasses: [business_contact, communication]
  - capability: mail.message.send
    authority: execute
    mode: optional
    risk: critical
    purpose: Send the exact approved follow-up message.
    customerFacing: true
    defaultPolicy: forbidden
    dataClasses: [business_contact, communication]
  - capability: messaging.channel.post
    authority: approve
    mode: optional
    risk: medium
    purpose: Notify the configured internal sales channel about a routed lead.
    customerFacing: false
    defaultPolicy: approval_required
    dataClasses: [business_contact, crm_activity]
requiredCapabilities: [crm.lead.read, crm.account.read]
optionalCapabilities: [enrichment.account.read, crm.lead.update, mail.message.draft, mail.message.send, messaging.channel.post]
topology:
  objects:
    - { id: inbound-lead, objectType: lead, label: Inbound lead, description: A durable lead and source identity with consent fit intent and campaign evidence., shared: true, identityKeys: [leadId, email] }
    - { id: account-research, objectType: account_research, label: Account research, description: Verified company buyer trigger and fit evidence with source references and freshness., shared: true, identityKeys: [accountId, researchVersion] }
    - { id: qualification, objectType: lead_qualification, label: Qualification decision, description: A versioned fit and intent decision with evidence confidence and reviewer corrections., shared: true, identityKeys: [leadId, qualificationVersion] }
    - { id: lead-assignment, objectType: lead_assignment, label: Lead assignment, description: The exact owner queue SLA and routing reason selected for a qualified lead., shared: true, identityKeys: [leadId, assignmentVersion] }
    - { id: sales-outcome, objectType: sales_outcome, label: Sales outcome, description: Observed meeting opportunity rejection and customer-quality evidence returned to qualification., shared: true, identityKeys: [leadId, observationWindow] }
  flows:
    - { id: lead-enters-intake, source: { kind: object, id: inbound-lead }, target: { kind: loop, id: sales-inbound-lead-intake }, type: evidence_in, reason: Hermes starts one lead problem only after source identity and minimum consent evidence resolve. }
    - { id: intake-returns-to-research, source: { kind: loop, id: sales-inbound-lead-intake }, target: { kind: loop, id: sales-inbound-account-research }, type: learning_return, reason: Accepted intake evidence becomes a bounded research request. }
    - { id: research-produces-account, source: { kind: loop, id: sales-inbound-account-research }, target: { kind: object, id: account-research }, type: produces, reason: Account claims remain cited and time-bounded instead of becoming unverified personalization. }
    - { id: research-enters-qualification, source: { kind: object, id: account-research }, target: { kind: loop, id: sales-inbound-lead-qualification }, type: evidence_in, reason: Qualification combines verified account evidence with the confirmed company definition. }
    - { id: qualification-produces-decision, source: { kind: loop, id: sales-inbound-lead-qualification }, target: { kind: object, id: qualification }, type: produces, reason: Qualification is an explainable decision with evidence confidence and a policy version. }
    - { id: qualification-returns-to-routing, source: { kind: loop, id: sales-inbound-lead-qualification }, target: { kind: loop, id: sales-inbound-lead-routing }, type: learning_return, reason: Only an eligible qualification can request owner and SLA routing. }
    - { id: routing-produces-assignment, source: { kind: loop, id: sales-inbound-lead-routing }, target: { kind: object, id: lead-assignment }, type: produces, reason: The assignment is reviewable before any CRM mutation or notification. }
    - { id: routing-returns-to-follow-up, source: { kind: loop, id: sales-inbound-lead-routing }, target: { kind: loop, id: sales-inbound-follow-up }, type: learning_return, reason: Follow-up preparation receives the exact qualification assignment and approved message context. }
    - { id: follow-up-returns-to-learning, source: { kind: loop, id: sales-inbound-follow-up }, target: { kind: loop, id: sales-inbound-qualification-learning }, type: learning_return, reason: Downstream meeting and opportunity evidence evaluates whether qualification and routing were useful. }
    - { id: learning-produces-sales-outcome, source: { kind: loop, id: sales-inbound-qualification-learning }, target: { kind: object, id: sales-outcome }, type: produces, reason: Reviewer corrections and observed outcomes become shared learning for Sales and Marketing. }
entrypoints:
  loops:
    - loops/lead-intake.yaml
    - loops/account-research.yaml
    - loops/lead-qualification.yaml
    - loops/lead-routing.yaml
    - loops/follow-up.yaml
    - loops/qualification-learning.yaml
  skills:
    - skills/account-research.yaml
    - skills/icp-evaluation.yaml
    - skills/buying-signal-analysis.yaml
    - skills/personalized-follow-up.yaml
  connectors:
    - connectors/hubspot-gmail-slack.yaml
    - connectors/salesforce-outlook-teams.yaml
  setup: [setup/questions.yaml]
  policies: [policies/default.yaml]
  fixtures:
    - fixtures/high-fit.json
    - fixtures/low-fit.json
    - fixtures/missing-enrichment.json
    - fixtures/duplicate-lead.json
    - fixtures/existing-customer.json
    - fixtures/ambiguous-account.json
    - fixtures/low-confidence.json
    - fixtures/connector-unavailable.json
    - fixtures/missing-field.json
    - fixtures/approval-required.json
    - fixtures/customer-facing-action.json
    - fixtures/outcome-unavailable.json
    - fixtures/retry-replay.json
    - fixtures/upgrade-rollback.json
  evals: [evals/conformance.yaml]
  dashboards: [dashboards/outcomes.yaml]
  assets: []
ownership:
  defaultOwnerRole: sales_operations
  reviewRoles: [sales_manager, revenue_operations]
  supportUrl: https://github.com/mrrkrieg/loopgraph/issues
defaultRolloutMode: shadow
