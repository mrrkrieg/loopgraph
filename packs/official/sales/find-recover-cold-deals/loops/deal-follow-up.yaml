schemaVersion: loopgraph-app-loop/v1alpha1
kind: AppLoop
metadata:
  id: sales-deal-follow-up
  name: Deal Recovery Follow-Up
  version: 1.0.0
  description: Prepare evidence-backed recovery actions, CRM changes, and customer-facing drafts for explicit approval.
  department: sales
  ownerRole: account_executive
  tags: [follow-up, recovery, approval]
trigger: { type: event, source: hermes, event: sales.recovery_plan_ready }
input: { requiredFields: [normalizedPayload.opportunityId, normalizedPayload.ownerId, normalizedPayload.recoveryGoal], subjectTypes: [opportunity, deal_risk], fixtures: [] }
routine:
  - { id: review, name: Review recovery evidence, actor: system, type: observe, description: "Load the exact risk, missing commitment, stakeholder gap, owner, and customer context." }
  - { id: compose, name: Compose bounded recovery, actor: agent, type: prepare, description: "Prepare a CRM next step, internal brief, and optional customer draft aligned to the evidence." }
  - { id: approve, name: Request exact approval, actor: human, type: verify, description: "Require separate approval for every prepared provider action and customer-facing draft." }
  - { id: record, name: Record approved action, actor: system, type: verify, description: "Commit only the exact approved fingerprint and preserve provider receipts." }
  - { id: learn, name: Learn from response, actor: system, type: learn, description: "Return re-engagement, meeting, progression, rejection, and no-response evidence." }
capabilities:
  - { key: crm.opportunity.read, authority: read, risk: low, required: true, purpose: Read current opportunity state before preparing recovery., customerFacing: false }
  - { key: mail.thread.read, authority: read, risk: high, required: true, purpose: Read bounded communication context for a relevant draft., customerFacing: false }
  - { key: calendar.event.read, authority: read, risk: medium, required: true, purpose: Avoid proposing a next step that already exists., customerFacing: false }
  - { key: crm.opportunity.update, authority: approve, risk: high, required: false, purpose: Apply the exact approved next step or risk field., customerFacing: false }
  - { key: mail.message.draft, authority: approve, risk: high, required: false, purpose: Create the exact approved customer-facing draft without sending., customerFacing: true }
  - { key: collaboration.message.draft, authority: approve, risk: medium, required: false, purpose: Create the approved internal recovery brief., customerFacing: false }
skills: [sales-follow-up, sales-multithreading, sales-commitment-extraction]
outcomes:
  - { metric: at_risk_deal_reengagement_rate, description: At-risk opportunities with a verified buyer response after approved recovery., direction: increase, sourceCapability: mail.thread.read }
  - { metric: recovery_meeting_booked_rate, description: At-risk opportunities with a verified follow-up meeting., direction: increase, sourceCapability: calendar.event.read }
routing:
  schemaVersion: routing-contract/v1alpha1
  problemTypes: [sales.deal_recovery]
  accepts: [{ sourcePattern: hermes, eventTypePattern: sales.recovery_plan_ready, subjectTypes: [opportunity, deal_risk], requiredFields: [normalizedPayload.opportunityId, normalizedPayload.ownerId, normalizedPayload.recoveryGoal], reason: An accountable owner and bounded recovery goal are ready for governed preparation. }]
  excludes: [{ sourcePattern: "*", eventTypePattern: sales.opportunity_changed, subjectTypes: [], fields: [], reason: Raw deal changes cannot directly create customer-facing recovery work. }]
  inputMapping: { opportunityId: normalizedPayload.opportunityId, ownerId: normalizedPayload.ownerId, recoveryGoal: normalizedPayload.recoveryGoal }
  priority: 80
  minimumConfidence: 0.92
  ambiguityPolicy: request_human
  noMatchPolicy: unhandled
  fanoutPolicy: { mode: none, maxRoutes: 1, requiresIndependentProblems: true }
  cooldown: { seconds: 0, dedupeWindowSeconds: 86400 }
  concurrency: { maxActive: 30, strategy: append_evidence }
  activationMode: shadow
  lifecycleEvents: [loopgraph.run.completed, loopgraph.outcome.observed]
  requiredConnections: [crm.opportunity.read, mail.thread.read, calendar.event.read]
  examples: { shouldRoute: ["An owner-approved recovery goal has complete opportunity evidence."], shouldNotRoute: ["The customer identity is ambiguous.", "No accountable owner exists."] }
policy:
  forbiddenActions:
    - { capability: mail.message.draft, reason: Customer communication requires exact prepared-action approval and this app never sends it. }
    - { capability: crm.opportunity.update, reason: CRM mutation requires exact prepared-action approval. }
    - { capability: collaboration.message.draft, reason: Internal distribution requires exact destination and content approval. }
  escalationOwner: sales_manager
  escalationSla: 4h
  separateCustomerFacingApproval: true
