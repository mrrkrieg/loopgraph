schemaVersion: loopgraph-app-setup/v1alpha1
kind: AppSetup
questions:
  - { key: pipelineStages, prompt: Which open pipeline stages should Hermes monitor?, why: Stage identity determines valid age and progress signals., valueType: object, requirement: required, inferFromContext: sales.pipelineStages, confirmWhenInferred: true }
  - { key: stageAgeThresholds, prompt: What maximum age is acceptable for each monitored stage and deal class?, why: Explicit thresholds prevent generic activity heuristics from becoming risk decisions., valueType: object, requirement: required, inferFromContext: sales.stageAgeThresholds, confirmWhenInferred: true }
  - { key: nextStepPolicy, prompt: What counts as a valid next step for each stage?, why: Hermes needs your commitment contract before it can identify missing next steps., valueType: object, requirement: required, inferFromContext: sales.nextStepPolicy, confirmWhenInferred: true }
  - { key: strategicAccounts, prompt: Which accounts or opportunities require stricter thresholds and escalation?, why: Strategic exposure changes urgency and reviewer ownership but not evidence quality., valueType: object, requirement: required, inferFromContext: sales.strategicAccounts, confirmWhenInferred: true }
  - { key: ownerMapping, prompt: "Who owns each territory, opportunity class, and escalation?", why: "Every risk and recovery action needs one accountable human owner.", valueType: object, requirement: required, inferFromContext: sales.ownerMapping, confirmWhenInferred: true }
  - { key: stakeholderPolicy, prompt: Which stakeholder roles should be verified at each stage?, why: Multithreading expectations must come from company policy rather than agent assumptions., valueType: object, requirement: required, inferFromContext: sales.stakeholderPolicy, confirmWhenInferred: true }
  - { key: recoveryChannels, prompt: Which internal and customer-facing channels may be prepared for review?, why: Capability scope and approval depend on explicit destinations., valueType: object, requirement: required, inferFromContext: sales.recoveryChannels, confirmWhenInferred: true }
  - { key: outcomeWindow, prompt: How long after a risk decision should Hermes observe re-engagement and stage outcomes?, why: A predeclared window makes deal-learning comparable and auditable., valueType: object, requirement: required, inferFromContext: sales.outcomeWindow, confirmWhenInferred: true }
  - { key: forecastPolicy, prompt: Which forecast categories and accuracy definition should the outcome loop use?, why: Hermes may measure forecast quality but cannot invent or change your forecast policy., valueType: object, requirement: required, inferFromContext: sales.forecastPolicy, confirmWhenInferred: true }
